.md","l":17,"t":"**Brand vibing.** Product names everywhere. Logo lockup in the CTA covers this.","o":"archivo"},"67f2beaeb3ef":{"s":"storyboard-architect","a":"references/on-screen-text.md","l":18,"t":"**Filler beats.** If the shot doesn't need text, leave it clean.","o":"archivo"},"4ff066eab26b":{"s":"storyboard-architect","a":"references/on-screen-text.md","l":26,"t":"When a shot has on-screen text, the **shot subject must reserve space for it**. This is enforced at storyboard time, not generation time.","o":"archivo"},"7a7cb7a4a5e8":{"s":"storyboard-architect","a":"references/on-screen-text.md","l":43,"t":"`{x: %, y: %}` | Custom, only when the standard positions don't fit","o":"archivo"},"9f4f78bc99a2":{"s":"storyboard-architect","a":"references/on-screen-text.md","l":63,"t":"Avoid stacking animations. Pick one per overlay.","o":"archivo"},"4cbacbc0b8fa":{"s":"storyboard-architect","a":"references/on-screen-text.md","l":67,"t":"The `color` field of every text overlay must be a hex value that exists in the brand-lock palette. If you find yourself wanting a color that's not in the palette, the answer is not to add it, the answer is to pick a different overlay style or shot composition.","o":"auditoria"},"d7940c08b552":{"s":"storyboard-architect","a":"references/on-screen-text.md","l":71,"t":"Same: every `font` field must reference a font defined in brand-lock typography. Two fonts max per project (display + body). More than that and the brand stops being recognizable.","o":"auditoria"},"717463d29f8f":{"s":"storyboard-architect","a":"references/on-screen-text.md","l":75,"t":"Already covered in timing-rules.md but worth repeating: text needs to be on screen long enough for someone to read it twice. Calculate, then verify. Don't eyeball.","o":"archivo"},"7268a7328d89":{"s":"storyboard-architect","a":"references/shot-grammar.md","l":3,"t":"Controlled vocabulary. Use these exact terms in `shots.json`. Generators interpret loose language inconsistently, locked vocabulary survives translation.","o":"archivo"},"74926ea5bff7":{"s":"storyboard-architect","a":"references/shot-grammar.md","l":11,"t":"`MCU` | Medium close-up | Head and shoulders","o":"archivo"},"6b3fa7bb2923":{"s":"storyboard-architect","a":"references/shot-grammar.md","l":29,"t":"Default to eye-level. Use the others deliberately, not for variety.","o":"archivo"},"5528555145f9":{"s":"storyboard-architect","a":"references/shot-grammar.md","l":50,"t":"`shallow` | Subject sharp, background blurred","o":"archivo"},"e4e41d7c48e9":{"s":"storyboard-architect","a":"references/shot-grammar.md","l":54,"t":"Default to shallow for talking-head, deep for environmental and schematic.","o":"archivo"},"03a00602482e":{"s":"storyboard-architect","a":"references/shot-grammar.md","l":58,"t":"Don't redefine per shot. Define once in `series_lock.lighting`. Examples:","o":"archivo"},"05f30ccb87c3":{"s":"storyboard-architect","a":"references/shot-grammar.md","l":90,"t":"**brand_lock**, locked across the entire project. Palette, type, \"never\" list.","o":"auditoria"},"22f6035ce704":{"s":"storyboard-architect","a":"references/timing-rules.md","l":3,"t":"Pacing is math, not feel. Use these as defaults. Override only with reason documented in rationale.","o":"archivo"},"32344b412ad5":{"s":"storyboard-architect","a":"references/timing-rules.md","l":19,"t":"The hook is 0–2s. Always. There are no exceptions in short-form content. Specifically:","o":"archivo"},"e67edc98e31f":{"s":"storyboard-architect","a":"references/timing-rules.md","l":21,"t":"9:16 social: first frame must telegraph the topic. Auto-play on mute means the first half-second is fighting a swipe.","o":"archivo"},"5e8113658ff6":{"s":"storyboard-architect","a":"references/timing-rules.md","l":24,"t":"The hook shot framing should be high-contrast against the shots that follow. If shot 2 is MS, shot 1 should not be MS. Visual contrast = retention.","o":"archivo"},"7e40e9d57114":{"s":"storyboard-architect","a":"references/timing-rules.md","l":30,"t":"Last shot should hold long enough for someone to read the CTA text and act","o":"archivo"},"5acc0a53e64b":{"s":"storyboard-architect","a":"references/timing-rules.md","l":31,"t":"Don't put motion on the CTA shot, let the text breathe","o":"archivo"},"8499e1ad407c":{"s":"storyboard-architect","a":"references/timing-rules.md","l":36,"t":"A text overlay needs to be on screen long enough to be **read twice**. Not once, twice. Why: viewers are skimming, eyes don't always lock on first frame.","o":"archivo"},"8a7cde5fbf44":{"s":"storyboard-architect","a":"references/timing-rules.md","l":47,"t":"Shorten the copy","o":"archivo"},"1740a84f47a3":{"s":"storyboard-architect","a":"references/timing-rules.md","l":48,"t":"Carry the text across two consecutive shots (text persists during cut)","o":"archivo"},"6c398f45603b":{"s":"storyboard-architect","a":"references/timing-rules.md","l":49,"t":"Lengthen the shot","o":"archivo"},"6c97051eb055":{"s":"storyboard-architect","a":"references/timing-rules.md","l":51,"t":"Do not under-time text. It's the most common storyboard failure.","o":"archivo"},"e7f6806c93e3":{"s":"storyboard-architect","a":"references/timing-rules.md","l":79,"t":"Sum of `(end - start)` across all shots equals project duration ±0.1s","o":"archivo"},"35389a2e7e9a":{"s":"storyboard-architect","a":"references/timing-rules.md","l":80,"t":"No shot has `start >= end`","o":"archivo"},"993e2cd1eec5":{"s":"storyboard-architect","a":"references/timing-rules.md","l":81,"t":"No two shots overlap","o":"archivo"},"40867e840a40":{"s":"storyboard-architect","a":"references/timing-rules.md","l":82,"t":"First shot starts at 0.0","o":"archivo"},"e620d729b974":{"s":"storyboard-architect","a":"references/timing-rules.md","l":83,"t":"Last shot ends at project duration","o":"archivo"},"0678f6cbf749":{"s":"storyboard-architect","a":"references/timing-rules.md","l":84,"t":"Every text overlay's `enter.at` is ≥ its shot's `start`","o":"archivo"},"5d267e42e94d":{"s":"storyboard-architect","a":"references/timing-rules.md","l":85,"t":"Every text overlay's `exit.at` is ≤ its shot's `end` (or carries to a flagged successor shot)","o":"archivo"},"18b6449fb38c":{"s":"storyboard-architect","a":"references/timing-rules.md","l":86,"t":"Every text overlay's on-screen duration ≥ read-twice threshold","o":"archivo"},"090ccfb96455":{"s":"storyboard-html-preview","a":"SKILL.md","l":10,"t":"The constraint is non-negotiable: **single file, no build step, no server, works offline.** Any time the output requires \"run this build command\" or \"host this somewhere,\" the skill has failed.","o":"archivo"},"629bb2d205d3":{"s":"storyboard-html-preview","a":"SKILL.md","l":40,"t":"An entry in `shot.assets.generated` marked `accepted: true`","o":"archivo"},"b9f0e777f95a":{"s":"storyboard-html-preview","a":"SKILL.md","l":41,"t":"The newest entry in `shot.assets.generated`","o":"archivo"},"09e4367e3b97":{"s":"storyboard-html-preview","a":"SKILL.md","l":82,"t":"The HTML preview should *feel* like the brand without going overboard. Quiet branding, not loud.","o":"archivo"},"8a2c11a5fc35":{"s":"storyboard-html-preview","a":"SKILL.md","l":86,"t":"Use `templates/preview.html.tpl` as the structural template. Read it before generating.","o":"archivo"},"410599a6e6d1":{"s":"storyboard-html-preview","a":"SKILL.md","l":159,"t":"frames as base64. Ask the user which they prefer if frames are present.","o":"archivo"},"e3ddb1d823f5":{"s":"storyboard-html-preview","a":"SKILL.md","l":211,"t":"Ensure text overlays render legibly","o":"archivo"},"32701372f5d1":{"s":"storyboard-html-preview","a":"SKILL.md","l":212,"t":"Use black-on-white where brand colors won't print well","o":"archivo"},"6975e2ff7171":{"s":"storyboard-html-preview","a":"SKILL.md","l":214,"t":"The user should be able to hit Cmd-P / Ctrl-P and get a clean PDF.","o":"archivo"},"77570da551dd":{"s":"storyboard-html-preview","a":"SKILL.md","l":224,"t":"No CDN scripts. No Google Fonts. No external CSS frameworks. The file must work with no internet connection.","o":"archivo"},"d86f1629a7f6":{"s":"storyboard-html-preview","a":"SKILL.md","l":230,"t":"Hit Cmd-P. The result should be a clean PDF. If layout breaks across page boundaries, the print stylesheet is broken.","o":"archivo"},"90b1a187484f":{"s":"storyboard-html-preview","a":"SKILL.md","l":234,"t":"Use brand colors as accents, not as full backgrounds. The reviewer's job is to read the storyboard, not admire the design. Subtle.","o":"archivo"},"9f76efb872f5":{"s":"storyboard-html-preview","a":"SKILL.md","l":238,"t":"Stakeholders open links on phones. The HTML should be readable on mobile without horizontal scroll. Simple responsive CSS.","o":"archivo"},"2d5d435df3ef":{"s":"video","a":"SKILL.md","l":16,"t":"**Still keyframes, character sheets, animatic panels** to feed the video pipeline: use the sibling `image` skill, then return with the keyframes.","o":"archivo"},"f21bcfe2dfbc":{"s":"video","a":"SKILL.md","l":76,"t":"If any shot fails, fix before sending. This is the step the user has had to enforce repeatedly. Do not skip it.","o":"archivo"},"99b3186877c9":{"s":"video","a":"SKILL.md","l":97,"t":"Prefer: ready-to-copy prompts, clear section labels, production language, motivated camera and light direction, strict continuity blocks, model-specific syntax, direct fixes.","o":"archivo"},"54b8e873fa4e":{"s":"video","a":"SKILL.md","l":99,"t":"Avoid: long theory unless asked, academic lectures, vague inspiration, decorative jargon, \"cinematic masterpiece\" filler, prompts without camera and light, prompts without continuity, stacking more than two director references, abstract emotions without physical translation.","o":"archivo"},"1abf520d87fe":{"s":"video","a":"references/animatic-keyframes.md","l":3,"t":"This is the still-panel layer. A storyboard keyframe is not a frame grab of footage — it is a single drawn image that must carry one story-beat with **no motion and (usually) no face**. The animatic hangs off these panels. A panel that only looks good is wallpaper; a panel must report its story function, its drama, and the motion it cannot show, all frozen.","o":"archivo"},"24fe340cb58e":{"s":"video","a":"references/animatic-keyframes.md","l":25,"t":"In an animatic the **panel is the unit, not the shot.** A shot has duration, motion, and sound to carry its function across time. A keyframe has one frozen image and must carry the same function in a single glance. So every panel does four things at once, in one still:","o":"archivo"},"43a9c422d34f":{"s":"video","a":"references/animatic-keyframes.md","l":29,"t":"**One emotion** — routed through metal, rubber, light, or anatomy, never named (`dramaturgy.md` §2). Mixed signals = no signal.","o":"archivo"},"b9cd34ffcb70":{"s":"video","a":"references/animatic-keyframes.md","l":77,"t":"**Ritual / staging** (quiet) | 1 hero panel, held | 1 panel living 1.5-2.5s | A silent beat is monolithic. Do not subdivide it — its power is that nothing moves while the world holds its breath. One symmetric \"breath\" frame, most negative space, least motion.","o":"archivo"},"b04a79b44100":{"s":"video","a":"references/animatic-keyframes.md","l":80,"t":"**Contest** (sustained roar) | alternating | fragment-cluster ↔ one held detail | Never two bang-clusters back to back. Between every burst, one held quiet panel — loud only works next to quiet.","o":"archivo"},"6d32d7171722":{"s":"video","a":"references/animatic-keyframes.md","l":83,"t":"**Allocation rule.** A 30s spot lands at ~18-26 panels. Plot the board as a descending duration staircase (≈2.5s → 0.5s → 4fr), broken only by the one pre-launch pause and the one post-finish hold. The board should *read* as an accelerating tachometer even on mute. Give a beat a micro-burst only when the audio detonates; everywhere else, one panel that holds is stronger than three that scatter.","o":"archivo"},"0fb332eaeff4":{"s":"video","a":"references/animatic-keyframes.md","l":89,"t":"A keyframe cannot ramp, cut, or whip. Each missing move resolves into one of **six frozen cues**. Never write \"motion\" — write the artifact motion leaves behind. State the cue in the card's *Motion-as-still* field and again in the prompt's camera/light clause; models default to over-clean stabilization and will sand the speed off unless told (§7).","o":"archivo"},"84e4c557c5f1":{"s":"video","a":"references/animatic-keyframes.md","l":97,"t":"**Sharp-subject / blurred-field separation** | Shallow-DOF macro: knuckle, needle, latch razor-sharp, everything else dissolved. Isolation = the cut-to-detail frozen. | insert chain, crash-zoom arrival, hip-hop CU","o":"archivo"},"9116b6b7205f":{"s":"video","a":"references/animatic-keyframes.md","l":115,"t":"A face does four jobs: shows the feeling, shows where it looks, shows the cost, shows the decision. Faces banned, redistribute: **decision → anatomy mid-action; internal state → an object crossing a threshold; looking/rivalry → space** (§6 and `dramaturgy.md` §2). Assign one job per panel and tag it. The emotion must already be frozen *inside the object* — a still cannot let motion blur do the emo","o":"archivo"},"22aed852b261":{"s":"video","a":"references/animatic-keyframes.md","l":122,"t":"Use the substitution table as the core deliverable — when the script wants an emotion and no face is available, render this object at this crop. Cold palette throughout.","o":"archivo"},"5bea8ddfb87c":{"s":"video","a":"references/animatic-keyframes.md","l":144,"t":"**Depth-layer jobs (FG / MG / BG).** Write the prompt in three explicit depth clauses, each with a stated job. This is the engine of \"reads in one glance, rewards a second\" (extends `dramaturgy.md` §10 into a single still). If all three planes carry the same blur or scale, you have one plane, not three — force a sharp MG subject against a soft FG frame and a soft BG stake (shallow DOF is the panel","o":"archivo"},"c241a02cc037":{"s":"video","a":"references/animatic-keyframes.md","l":154,"t":"**Centerline spine, then break symmetry** — emotion: a single dominant axis (lane stripe, the Christmas Tree, a dividing wall) gives the eye a rail and makes even a chaotic frame readable; breaking it the instant one car noses ahead reads as momentum. — seen: Anderson centers for instant legibility; Bong breaks balanced staging to show a power shift. — *in a keyframe*: build one head-on symmetric ","o":"archivo"},"921f5446334f":{"s":"video","a":"references/animatic-keyframes.md","l":183,"t":"**Render audio as physical consequence, never as a named sound.** \"Loud engine\" is banned filler (`dramaturgy.md` §2) — prompt \"heat-haze warp off the headers, exhaust flame, chassis squat, sidewall wrinkle\" instead.","o":"archivo"},"d5feae1b60b8":{"s":"video","a":"references/animatic-keyframes.md","l":225,"t":"[ ] **Cold palette held** — steel/cyan/magenta/mercury-white, red and green as accents only, amber ≤15% and point-source (toxic, never cozy). One motivated source, ~70% unlit, one hard specular hit. Texture named (grain, halation, one flare), not \"clean.\"","o":"archivo"},"6f5a79ae61af":{"s":"video","a":"references/camera-lighting-vocabulary.md","l":3,"t":"Use precise production language. \"Cinematic\" is not a direction. \"35mm, slow push-in, warm window key from frame-left\" is.","o":"archivo"},"617b9596ef1d":{"s":"video","a":"references/camera-lighting-vocabulary.md","l":31,"t":"over-the-shoulder","o":"archivo"},"a3c2614e6e5e":{"s":"video","a":"references/camera-lighting-vocabulary.md","l":78,"t":"shallow depth of field.","o":"archivo"},"84e552ce62b9":{"s":"video","a":"references/camera-lighting-vocabulary.md","l":138,"t":"Define palette with concrete colors. Never write \"cinematic colors.\"","o":"archivo"},"0278247a92b4":{"s":"video","a":"references/camera-lighting-vocabulary.md","l":246,"t":"Rules of use. Name the transition and the exact moment it fires. One transition type per cut. When the choice is open, delegate: \"choose the most suitable from [natural cut / occlusion mask / match cut] for the style of this film.\"","o":"archivo"},"4594046fc713":{"s":"video","a":"references/dramaturgy.md","l":3,"t":"This is the mandatory layer. A beautiful frame without dramaturgy is wallpaper. Every prompt built by this skill must pass the dramaturgy check before it is sent to the user.","o":"archivo"},"f2664fed4b35":{"s":"video","a":"references/dramaturgy.md","l":45,"t":"The scene formula tells you **what a scene is**. The Details Law tells you **how every shot must be written**. Skip it and even a perfect dramaturgical structure produces mush on screen.","o":"archivo"},"fe8ae4c731e8":{"s":"video","a":"references/dramaturgy.md","l":53,"t":"**Environmental pressure.** A physical fact about the space that carries the emotion. Cold refrigerator light. Wet asphalt. Flickering ceiling tube. Steam from the kettle. Rain on one specific windowpane. A buzzing AC unit. Tight corridor walls. Mirror reflection. (See §9 — Environment plays.)","o":"archivo"},"291a35a705ad":{"s":"video","a":"references/dramaturgy.md","l":54,"t":"**Physical micro-action on the body.** The emotion translated into the actor's body. Jaw locks. Knuckles whiten. Lips press flat. Eyes drop a quarter-inch. He swallows hard. Fingers curl against the doorframe. The actor's body is the only place where feelings render — names of feelings do not.","o":"archivo"},"adc3e3d51477":{"s":"video","a":"references/dramaturgy.md","l":55,"t":"**Sound anchor or visual motif.** A recurring perceptual hook tied to the spine of the piece. Stomach growl repeated three times. Reflection in dark glass on every transition. The same musical sting at every Crack beat. The clock's second hand. Footsteps in an empty corridor.","o":"archivo"},"435fff89e7d5":{"s":"video","a":"references/dramaturgy.md","l":81,"t":"Every shot must do at least one of three things. If it does none, delete it.","o":"archivo"},"dbb9069efcc9":{"s":"video","a":"references/dramaturgy.md","l":93,"t":"**Emotion (51%).** Does the cut honor the emotional truth of the moment. What does the viewer feel now vs. what they should feel next.","o":"archivo"},"5d494f11d5ec":{"s":"video","a":"references/dramaturgy.md","l":94,"t":"**Story (23%).** Does the cut advance story or reveal character.","o":"archivo"},"09ecf6f81ee5":{"s":"video","a":"references/dramaturgy.md","l":95,"t":"**Rhythm (10%).** Does the cut fall on a musical beat of the scene.","o":"archivo"},"94cb46e0cdd8":{"s":"video","a":"references/dramaturgy.md","l":96,"t":"**Eye-trace (7%).** Where is the viewer's gaze at the moment of the cut. Does the new shot receive that gaze naturally.","o":"archivo"},"0cf6378a2c57":{"s":"video","a":"references/dramaturgy.md","l":97,"t":"**2D plane (5%).** Does the cut respect the axis of screen direction.","o":"archivo"},"dd109f775c6c":{"s":"video","a":"references/dramaturgy.md","l":98,"t":"**3D space (4%).** Does the cut respect the geometry of the real location.","o":"archivo"},"5b4e8d3dcda1":{"s":"video","a":"references/dramaturgy.md","l":116,"t":"Good. \"He edges toward the window but his shoulder stays angled back toward her, as if the conversation still holds him.\"","o":"archivo"},"2be8adc698a8":{"s":"video","a":"references/dramaturgy.md","l":150,"t":"Good. \"Push-in starts on 'I don't know' and stops on her jaw locking.\"","o":"archivo"},"c7fa86763233":{"s":"video","a":"references/dramaturgy.md","l":154,"t":"Spielberg principle. Even in chaos, the viewer must know.","o":"archivo"},"f88d89dd2268":{"s":"video","a":"references/dramaturgy.md","l":200,"t":"Adjust for 30s or 15s by compressing proportionally. Never skip the Crack or the Impact.","o":"archivo"},"6be9ddc67dea":{"s":"video","a":"references/dramaturgy.md","l":251,"t":"**Eye trace.** Where the viewer's gaze should land in the first 0.3s.","o":"archivo"},"c2e0a3b45412":{"s":"video","a":"references/dramaturgy.md","l":276,"t":"Always insert at least one pause before the biggest cut.","o":"archivo"},"01d9db058ef3":{"s":"video","a":"references/dramaturgy.md","l":347,"t":"Is the scene formula complete? (desire + obstacle + geometry + gaze + rhythm)","o":"archivo"},"75eee4c9c72b":{"s":"video","a":"references/dramaturgy.md","l":348,"t":"Does every shot pass the three-detail check? (environmental pressure + physical micro-action + sound or visual motif)","o":"archivo"},"c52b9a2cbc96":{"s":"video","a":"references/dramaturgy.md","l":349,"t":"Does every shot do one of the three jobs? (change emotion, advance action, increase pressure)","o":"archivo"},"cd71da05d199":{"s":"video","a":"references/dramaturgy.md","l":350,"t":"Is there a motivated reason for every camera move?","o":"archivo"},"e51237770b8c":{"s":"video","a":"references/dramaturgy.md","l":351,"t":"Is the spatial geometry readable?","o":"archivo"},"eba7494935d3":{"s":"video","a":"references/dramaturgy.md","l":352,"t":"Are the five anchors named? (emotion, motif, object, break, final image)","o":"archivo"},"4ddd5b7aae62":{"s":"video","a":"references/fixes-and-skeletons.md","l":58,"t":"For Kling. Use Element Binding with 3-4 reference images (front, side, three-quarter).","o":"archivo"},"1df0239fdbc2":{"s":"video","a":"references/fixes-and-skeletons.md","l":98,"t":"For Seedance and Veo. Use positive phrasing.","o":"archivo"},"87d2484dd6cf":{"s":"video","a":"references/fixes-and-skeletons.md","l":121,"t":"Fix. Avoid style words like \"hyperrealistic 8k masterpiece.\" These push the model into AI-art territory. Use production language instead.","o":"archivo"},"1863ac937570":{"s":"video","a":"references/fixes-and-skeletons.md","l":147,"t":"For forward extensions, the standard clause: \"prohibit rigid cutting, prohibit objects appearing out of thin air.\"","o":"archivo"},"d98803cf48d0":{"s":"video","a":"references/fixes-and-skeletons.md","l":157,"t":"On Seedance 2.5 and Veo this is reliable. On Seedance 1.x/2.0 and Kling, also avoid mentioning any on-screen text or score you do not want — mentions summon them.","o":"archivo"},"8f83dc97e5ba":{"s":"video","a":"references/fixes-and-skeletons.md","l":230,"t":"Keep character continuity.","o":"archivo"},"8ea66f62d954":{"s":"video","a":"references/fixes-and-skeletons.md","l":231,"t":"Keep story action.","o":"archivo"},"13635ca633f1":{"s":"video","a":"references/fixes-and-skeletons.md","l":232,"t":"Keep shot timecodes (where relevant).","o":"archivo"},"508966ae84b9":{"s":"video","a":"references/fixes-and-skeletons.md","l":233,"t":"Keep lighting.","o":"archivo"},"7dabe8b7b479":{"s":"video","a":"references/fixes-and-skeletons.md","l":234,"t":"Keep camera.","o":"archivo"},"b755a79d8702":{"s":"video","a":"references/fixes-and-skeletons.md","l":235,"t":"Keep editing grammar.","o":"archivo"},"2d6cacf87d0d":{"s":"video","a":"references/fixes-and-skeletons.md","l":237,"t":"Remove philosophy and meta-commentary.","o":"archivo"},"c485717d92a0":{"s":"video","a":"references/fixes-and-skeletons.md","l":238,"t":"Remove extra adjectives.","o":"archivo"},"f1cf3ccb4d13":{"s":"video","a":"references/fixes-and-skeletons.md","l":239,"t":"Remove director references.","o":"archivo"},"a7febb0fdf00":{"s":"video","a":"references/fixes-and-skeletons.md","l":249,"t":"One ready-to-copy prompt for one generation. Use the appropriate model skeleton.","o":"archivo"},"61f2696d823a":{"s":"video","a":"references/fixes-and-skeletons.md","l":274,"t":"Missing direction (camera, light, continuity).","o":"archivo"},"179286c8c088":{"s":"video","a":"references/fixes-and-skeletons.md","l":276,"t":"Model-specific mismatches (wrong syntax for the chosen model).","o":"archivo"},"c16f3957c655":{"s":"video","a":"references/fixes-and-skeletons.md","l":277,"t":"Stronger version. Rewritten prompt, ready to copy.","o":"archivo"},"a82de4fa4979":{"s":"video","a":"references/fixes-and-skeletons.md","l":294,"t":"Structured scene-by-scene JSON. Use for complex continuity. See `references/veo.md` section 6.","o":"archivo"},"d85e439effb2":{"s":"video","a":"references/kling.md","l":7,"t":"**Kling 3.0 — multi-shot, native audio, 15s (read first if user is on 3.0)**","o":"archivo"},"0809eafc4ffb":{"s":"video","a":"references/kling.md","l":65,"t":"Introduce every character and key object at the **start** of the prompt, before any shot description. Use unique consistent identifiers — the same label survives across all shots:","o":"archivo"},"bb25b6a212a2":{"s":"video","a":"references/kling.md","l":93,"t":"Each shot must answer: **framing + subject + motion**. Empty shot descriptions (\"static frame, ambient mood\") collapse into one continuous take.","o":"archivo"},"71e86bdfe510":{"s":"video","a":"references/kling.md","l":99,"t":"**P1. Structured naming.** Use unique identifiers per character.","o":"archivo"},"a4313d46162b":{"s":"video","a":"references/kling.md","l":109,"t":"✓ `[Character B, clear fearful voice]: \"Don't open it.\"`","o":"archivo"},"9e30b0899784":{"s":"video","a":"references/kling.md","l":112,"t":"**P4. Temporal control between lines.** Use linking words to prevent dialogue from merging.","o":"archivo"},"7d81fcd5ccc0":{"s":"video","a":"references/kling.md","l":113,"t":"✓ \"Character A: 'I won't ask again.' **Immediately,** Character B: 'You don't have to.'\"","o":"archivo"},"21472873e0ca":{"s":"video","a":"references/kling.md","l":130,"t":"Use these terms directly — the model treats them as instructions, not flavor:","o":"archivo"},"c9b8d9532823":{"s":"video","a":"references/kling.md","l":138,"t":"In the Kling app, Master Shot presets (\"Move Forward and Zoom Up\" etc.) are more stable than hand-written camera prose and save credits — prefer them for standard moves, prose for motivated ones.","o":"archivo"},"4286109b9522":{"s":"video","a":"references/kling.md","l":142,"t":"If the task hits any of these — **use Kling 3.0 over earlier Kling**:","o":"archivo"},"8b8795ac59fd":{"s":"video","a":"references/kling.md","l":156,"t":"`duration` — per-shot durations must sum to ≤ 15s.","o":"archivo"},"eeae0374284b":{"s":"video","a":"references/kling.md","l":175,"t":"For Kling 3.0, use the multi-shot structure from section 3 instead.","o":"archivo"},"5c7946d7fd9f":{"s":"video","a":"references/kling.md","l":189,"t":"Kling has a dedicated negative prompts field. The field auto-interprets input as exclusion. Do not write \"no X\". Write the thing itself.","o":"archivo"},"15b3f8595289":{"s":"video","a":"references/kling.md","l":220,"t":"Even lighting. Avoid hard shadows. The AI can mistake them for permanent facial features.","o":"archivo"},"7a47e689454a":{"s":"video","a":"references/kling.md","l":232,"t":"A character element takes either a **3-8s video** (the model extracts both appearance and voice) or up to **4 multi-angle stills** (front, three-quarter, profile, back), plus optional **voice binding** (5-30s audio clip). Once bound, the voice belongs to the subject — do not re-describe it in the prompt.","o":"archivo"},"d94be792c74d":{"s":"video","a":"references/kling.md","l":235,"t":"Cost of the feature: several practitioners report visible image-quality degradation the moment elements/references are enabled. Use elements only when consistency actually matters; for one-off clips, in-prompt labels are cleaner.","o":"archivo"},"0db6e0a2de52":{"s":"video","a":"references/kling.md","l":241,"t":"Critical rule. The text prompt MUST match the brush motion. If you brush a river flowing and write \"stagnant pond\" the model tears itself apart. Align prompt verbs with brush directions.","o":"archivo"},"1e5d66901508":{"s":"video","a":"references/kling.md","l":245,"t":"Copy motion from a reference video. Use when you need specific performance or choreography (dance, martial arts, specific gait). The prompt then focuses on subject description only, the reference handles motion.","o":"archivo"},"36686df1386d":{"s":"video","a":"references/kling.md","l":249,"t":"Keep the prompt short (20-40 words). Focus only on motion. Do not re-describe static elements the model already sees.","o":"archivo"},"7d3ab7f4ba2a":{"s":"video","a":"references/kling.md","l":273,"t":"Fix. Upload 3-4 reference images to Element Library. Use Bind Elements in the settings.","o":"archivo"},"cf73cec68544":{"s":"video","a":"references/kling.md","l":289,"t":"Fix. Make shot boundaries explicit: `Shot 1 (0-3s). ... Shot 2 (3-6s). ...`. Each shot description must include a different framing or camera angle. If two adjacent shots share both framing and angle, the model merges them.","o":"archivo"},"85c33c12c479":{"s":"video","a":"references/kling.md","l":301,"t":"Fix. Strip references to the essential ones only; for one-off clips prefer in-prompt `[Character A: ...]` labels over elements. Accept the trade: elements buy consistency, not fidelity.","o":"archivo"},"4b9361768f1a":{"s":"video","a":"references/kling.md","l":305,"t":"Fix. Give each character its own element (or its own labeled identity block). Never let two speaking characters share one visual description.","o":"archivo"},"f876e8f2e5cb":{"s":"video","a":"references/patterns-and-genres.md","l":17,"t":"Use for tension builds, reveals, dramatic emphasis.","o":"archivo"},"5a27254127bb":{"s":"video","a":"references/patterns-and-genres.md","l":25,"t":"Use for psychological pressure, internal conflict, impending bad news.","o":"archivo"},"5465eb46d054":{"s":"video","a":"references/patterns-and-genres.md","l":33,"t":"Use for revealing a hidden element, exploration, search.","o":"archivo"},"240a672f7a78":{"s":"video","a":"references/patterns-and-genres.md","l":41,"t":"Use for comedic or dramatic disaster. Tiny object failures play bigger than explosions.","o":"archivo"},"5eaea7d005f0":{"s":"video","a":"references/patterns-and-genres.md","l":49,"t":"Use for ads with a hero product.","o":"archivo"},"4c683ca1e1ef":{"s":"video","a":"references/patterns-and-genres.md","l":57,"t":"Use for rhythmic repetition, transformation, performance.","o":"archivo"},"fae5c2bff912":{"s":"video","a":"references/patterns-and-genres.md","l":168,"t":"Inside each 5-second prompt, use timecodes.","o":"archivo"},"de49559afcec":{"s":"video","a":"references/patterns-and-genres.md","l":184,"t":"Use timecoded structure for Seedance and Veo. Kling prefers flowing prose.","o":"archivo"},"94114b6c3c86":{"s":"video","a":"references/patterns-and-genres.md","l":188,"t":"When moving from clip N to clip N+1, the first beat of the new clip should match the final beat of the previous clip. Character in same pose. Same light. Same color temperature. This is what makes them cut together cleanly in the editor.","o":"archivo"},"00552d374a9c":{"s":"video","a":"references/race-and-speed.md","l":28,"t":"**Authentic speed, never CGI-clean or sped-up.** Build velocity into the static composition (§3); never lean on a ramp to rescue a dead frame. Over-crank, glass-smooth stabilization and post speed-ramps read subconsciously as \"ad-speed\" and drain all threat. Squat, lifted nose, slick wrinkle, smeared rim — the physics has to be visible in the still.","o":"auditoria"},"47dd1d977a21":{"s":"video","a":"references/race-and-speed.md","l":29,"t":"**Detail is the emotion.** Faces banned, feeling renders only on a knuckle, a needle, a pedal, smoke, or a sweat bead (`dramaturgy.md` §2; the full substitution method is `animatic-keyframes.md` §5). A hand mid-grip is the no-face equivalent of a close-up on the eyes. No abstract \"motion\", no named feeling.","o":"auditoria"},"a2680889ec7c":{"s":"video","a":"references/race-and-speed.md","l":30,"t":"**One governing visual promise per piece.** A 30s cut earns cohesion from a single conceit: everything through reflections in painted metal, or everything through circles (tach → headlight → bulb → wheel), or everything as machine-talks / no-music. Kon's \"one visual principle\". Name it before boarding.","o":"auditoria"},"5e64b7c7d357":{"s":"video","a":"references/race-and-speed.md","l":31,"t":"**Beat-locked cutting.** Loudness in the audio = shot count on the board (§8; the density ladder itself is `animatic-keyframes.md` §3). Silence = one held panel. Bang = a burst of 4–8-frame micro-panels. Cut length is engine RPM made visual: idle = long panels, redline = collapsing panels toward the green.","o":"auditoria"},"1f3f073247b7":{"s":"video","a":"references/race-and-speed.md","l":32,"t":"**Cold combative palette** (§7). Steel blue, cyan, magenta, dirty mercury-white; **red as danger accent only** (brake glow, redline, tail-lights, the Tree's bulbs). No warm cozy amber wash — warmth appears only as toxin. Steal Tony Scott's grain, contrast and overexposure; **discard his warm grade.**","o":"auditoria"},"11ae3ea96fb0":{"s":"video","a":"references/race-and-speed.md","l":33,"t":"**Every insert is load-bearing.** Each detail panel must be captionable with one race label — *setup / commitment / mistake / recovery / proof-of-speed / result* (§4). If you cannot label it, it is a *fantik* (`dramaturgy.md` §3) — drop it. A board that is all proof-of-speed with no commitment/mistake/recovery is a reel, not a story.","o":"auditoria"},"611f323d3615":{"s":"video","a":"references/race-and-speed.md","l":42,"t":"→ **Rule:** never write \"motion\" — write the artifact motion leaves behind, and never board a neutral panel (every frame carries a forward vector, negative space ahead of the subject).","o":"auditoria"},"ca87c9bb0cd3":{"s":"video","a":"references/race-and-speed.md","l":57,"t":"A still has no engine note and zero motion. It sells velocity through the **speed-budget rule** — a frame reads fast only when **≥3 of five cues coexist** (camera at/below bumper height · asphalt streaking the lower frame · a near foreground reference passing the edge · sharp hero against motion-blurred background · a mechanical-vibration cue). The full rule, with the anti-fake firewall, lives in ","o":"auditoria"},"be25e9cc99a1":{"s":"video","a":"references/race-and-speed.md","l":73,"t":"**Long-lens compression** — the second speed register and the antidote to \"only blur sells speed\". Frankenheimer's 1000mm stacked distant cars onto the hero so closing distance reads as collapse. Pair compression panels with low-wide panels in the cut; never board the whole spot on one lens. In `seedance.md`/`veo.md` syntax name \"motion blur, fast-shutter look on background, sharp subject\" explici","o":"auditoria"},"fc4a79f80ec2":{"s":"video","a":"references/race-and-speed.md","l":81,"t":"A face does four jobs: internal state, where it looks, the cost, the decision. Banned, those jobs redistribute — **decision → anatomy mid-action; internal state → an object crossing a threshold; looking/rivalry → space.** The mechanism, the EMOTION→OBJECT substitution table and the state-change cheat-sheet are owned by `animatic-keyframes.md` §5; do not duplicate them. Two filters before you draw:","o":"auditoria"},"7a8e1fc6b5e6":{"s":"video","a":"references/race-and-speed.md","l":117,"t":"**Amber logic (decision point).** Choose the **Sportsman / full tree** for an ad: three ambers fire *sequentially 0.5s apart* — three drawable keyframes, a stretched drum-roll of dread with cut length collapsing toward the green. The Pro tree fires all three at once — one panel, brutal but no build. Draw the Sportsman stagger. Always leave on the **last amber, not the green** (holeshot): the launc","o":"auditoria"},"9bf2cbf9c271":{"s":"video","a":"references/race-and-speed.md","l":129,"t":"3 | **Hard-mounted cabin shake** | Pressure / Reaction | Rigid interior mount: dash/needle/hands vibrating, mirror trembling, world shuddering through glass | visible micro-vibration; never perfectly stable","o":"auditoria"},"0e9bacb2e8ad":{"s":"video","a":"references/race-and-speed.md","l":148,"t":"**Restless / handheld cam** | the frame never settles; constant threat, physiological unease | Never a perfectly level, perfectly clean panel — bake in a 1–3° drift, edge smear, off-true horizon, a faint micro-shake artifact even in a \"static\" cockpit | Pressure","o":"auditoria"},"98ee930c9f7c":{"s":"video","a":"references/race-and-speed.md","l":157,"t":"Faces are banned, so light is the only actor left. It does not \"set a mood\" — it **rims a material** so a piece of metal, rubber or skin reports the emotion a face would. General light grammar (sources, direction, quality) is `camera-lighting-vocabulary.md` §4–7; the anti-sterile firewall is `animatic-keyframes.md` §7 + `universal-rules.md` U12. The race-specific governing law: *embrace the dark* ","o":"auditoria"},"2be4bcd05090":{"s":"video","a":"references/race-and-speed.md","l":169,"t":"Toxic amber/sodium (rationed) | temporary, contaminated, alien — never cozy | sodium lamp as a passing smear; spilled fluid catching one lamp; the Tree's three ambers as countdown only","o":"auditoria"},"8a862f876fa8":{"s":"video","a":"references/race-and-speed.md","l":171,"t":"**Warmth as toxin** is the only permitted heat: brake-disc/exhaust glow (the machine at its thermal limit), a header flame stab gone in a frame, the Tree's alien ambers, a sickly sodium smear. Any warm element must be **point-source and surrounded by cold**. If amber fills more than ~15% of the frame it has become a wash — kill it.","o":"auditoria"},"f79825c8bfa6":{"s":"video","a":"references/race-and-speed.md","l":177,"t":"**Backlit smoke** [Pressure/Establish]: hard cyan or mercury-white punching *through* tire smoke from behind; volumetric shafts, the car a dark mass dissolving into glowing haze, red tail-light bleed inside the smoke for the danger accent. Front-lit smoke is dead gray nothing — always rim it from behind.","o":"auditoria"},"784a21fb3fba":{"s":"video","a":"references/race-and-speed.md","l":180,"t":"**Silhouette / contre-jour** [Power/Pressure]: helmet/shoulder as pure black shape against a blown headlight or the Tree's amber bank, one thin rim defining the form plus one glint on the visor edge, no features. The brain fills the dark with something worse than any face.","o":"auditoria"},"c50591694f2a":{"s":"video","a":"references/race-and-speed.md","l":183,"t":"**Texture and atmosphere.** Name the grain, never \"clean\": fine-to-medium film grain (heaviest in shadow), halation/bloom on hard practicals (soft glow ring + hard hot core), one anamorphic flare off the dominant source, slight chromatic fringe on the hottest edges (anti-sterile test in `animatic-keyframes.md` §7). One atmospheric pressure per panel (`dramaturgy.md` §9, Kurosawa) — backlit tire sm","o":"auditoria"},"5f835d0eb35a":{"s":"video","a":"references/race-and-speed.md","l":189,"t":"You storyboard the **sound first**; the keyframes hang off it. The general law — **loudness in the audio = panel count** — and the descending duration staircase are the density ladder in `animatic-keyframes.md` §3, sitting on the `dramaturgy.md` §12 rhythm staircase. Do not re-derive them. The race-specific rhythm rules:","o":"auditoria"},"a433636c2657":{"s":"video","a":"references/race-and-speed.md","l":191,"t":"**Engine as metronome.** Tie panel *duration* to RPM: idle = ~2s panels, redline = panels collapsing 2s → 1s → 0.5s → 8fr → 4fr toward the green. The board should read as an accelerating tachometer on mute. Annotate each panel with its on-screen life.","o":"auditoria"},"2d91bbc13caa":{"s":"video","a":"references/race-and-speed.md","l":194,"t":"**Pull-to-intimate at the peak.** At the contest's tensest point, cut from a wide loud pass to an ECU of glove-on-shifter / breath-fog, shallow focus, void around it — engines stripped to breath only. The *quiet* panel goes *tight*; the loud panel goes wide.","o":"auditoria"},"f5ef9ac105ef":{"s":"video","a":"references/race-and-speed.md","l":198,"t":"Every panel inherits a `Sound` cell even though it is a still (`dramaturgy.md` §11) — prompt the *physical consequence* of the sound (deformation, particulate, smear, heat-haze, isolation-in-void), never a named sound. Fill it.","o":"auditoria"},"19ef2dbc9666":{"s":"video","a":"references/race-and-speed.md","l":204,"t":"Five phases: **ritual → staging → launch → contest → release.** Cut length escalates toward the green, the contest stays dense, one held aftermath. ~20–26 panels. Function tags from `role-modes.md` §4. This is the structural skeleton; for a fully worked, panel-by-panel deliverable board of this exact structure (format C, ~13 rows), use `animatic-keyframes.md` §8 — do not draw a second worked board","o":"auditoria"},"de0ddf9ca295":{"s":"video","a":"references/race-and-speed.md","l":214,"t":"Allocation: plot the board as a descending duration staircase, broken only by the one pre-launch held panel (the single most-held still, most negative space) and the one post-finish hold. The launch is *never* one hero frame — fan it into the 6–9-panel micro-burst. No two bang-clusters touch; every burst is separated by a held quiet panel.","o":"auditoria"},"54d1d74f3df8":{"s":"video","a":"references/race-and-speed.md","l":231,"t":"[ ] No banned panel: static fetish insert (lever/badge/wheel with no verb, no state-change); anatomy at rest; a detail you cannot caption with a §4 label; all-proof-of-speed board with no commitment/mistake/recovery; decorative dashboard clutter (keyring, dice, coffee cup — \"each object is a clue\"); warm wash without narrative function.","o":"auditoria"},"1948fb0cd2ea":{"s":"video","a":"references/race-and-speed.md","l":233,"t":"Before sending the board, run `animatic-keyframes.md` §9 (per-panel master checklist), `dramaturgy.md` §15 and `universal-rules.md` §13 over it. The most-violated step is the three-detail check — do not skip it.","o":"auditoria"},"cedacf95ce49":{"s":"video","a":"references/role-modes.md","l":22,"t":"Every shot must answer at least one of these questions. If a shot answers none, delete it.","o":"auditoria"},"5c79b70fbb5a":{"s":"video","a":"references/role-modes.md","l":28,"t":"What does the viewer need to notice?","o":"auditoria"},"e47d5852520a":{"s":"video","a":"references/role-modes.md","l":47,"t":"Use one dominant director reference per scene. Translate into concrete camera, light, rhythm, blocking. Never stack three or more references.","o":"auditoria"},"d92564e28fe4":{"s":"video","a":"references/role-modes.md","l":68,"t":"Translate every beat into physical action the camera can see. Tag each beat with a shot function (see section 4). Every beat must have subtext.","o":"auditoria"},"9570d85c5b8a":{"s":"video","a":"references/role-modes.md","l":138,"t":"Every beat should carry at least one function tag. This is the editor's grammar.","o":"auditoria"},"85f471342e23":{"s":"video","a":"references/role-modes.md","l":153,"t":"A montage sequence can compress or loop. Use function tags to keep the structure readable even at high speed.","o":"auditoria"},"a84829cef94a":{"s":"video","a":"references/role-modes.md","l":155,"t":"Each tag is also a question the shot must answer. Establish. Where. Power. Who commands. Pressure. What pushes. Detail. What to notice. Reaction. What it cost. Shift. What changed inside. Impact. The moment. Aftermath. The residue. Exit. The image carried out.","o":"auditoria"},"dc069aea561b":{"s":"video","a":"references/seedance-25.md","l":52,"t":"Generation parameters (duration, aspect ratio, resolution) are set on the generation page or via API — **they do not belong in the prompt**. The 1.x/2.0 CLI tail (`--resolution ... --duration ...`) is not 2.5 syntax. Exception: in Ultra Long mode, restate duration and ratio at the top of the prompt.","o":"archivo"},"3c3a35bd5003":{"s":"video","a":"references/seedance-25.md","l":76,"t":"**Global tail.** Re-state the must-hold globals (camera position, environment, sound, lighting) and repeat the global bans.","o":"archivo"},"fe2010e7cd1e":{"s":"video","a":"references/seedance-25.md","l":82,"t":"2.5 has dedicated markers. Use them — do not describe audio in loose prose:","o":"archivo"},"5090be9f2dcb":{"s":"video","a":"references/seedance-25.md","l":103,"t":"The point of 50 slots is not dumping assets in. **Every material's role must be written in the prompt.** Do not rely on text labels inside images; do not make the model infer mappings.","o":"archivo"},"f4e68628a21b":{"s":"video","a":"references/seedance-25.md","l":115,"t":"**Bind each subject individually.** `<Character A> corresponds to @Image 1. Use only the appearance, hairstyle, and clothing.` The officially forbidden pattern: \"@Images 1 through 4 define four characters respectively\" — it never states which is which.","o":"archivo"},"1a73cf483aab":{"s":"video","a":"references/seedance-25.md","l":116,"t":"**Add exclusions** for anything that could bleed in: \"Do not use the image background.\" / \"Do not use the people in the image.\" / \"Do not use the person's identity, clothing, or scene from the video.\"","o":"archivo"},"8acb235535b4":{"s":"video","a":"references/seedance-25.md","l":117,"t":"**Do not restate what a reference already defines.** If a reference video defines the motion, state only which attributes to inherit — re-describing every action conflicts with the reference.","o":"archivo"},"9d8033a7fcbb":{"s":"video","a":"references/seedance-25.md","l":129,"t":"**Select references per scene**, not all at once: `Scene 1 | Use: <list>. Event: ... End state: ...`","o":"archivo"},"58c03455aad2":{"s":"video","a":"references/seedance-25.md","l":144,"t":"Divide the clip into consecutive stages. **One primary state change per stage, and always state the visible end state** — the end state is what the model steers toward (this is the U11 final-image rule, per stage).","o":"archivo"},"7e710b7de286":{"s":"video","a":"references/seedance-25.md","l":159,"t":"A time range is an event's **time budget, not an edit point**. Ranges must be consecutive and non-overlapping.","o":"archivo"},"2976ffd881f1":{"s":"video","a":"references/seedance-25.md","l":161,"t":"**One core action + one camera move per window.** Do not demand frequencies (\"three actions in one second\").","o":"archivo"},"83694d17ac4b":{"s":"video","a":"references/seedance-25.md","l":191,"t":"**The prohibition list is specific, not generic.** From the official farewell example: \"No exaggerated crying, no fast cuts, no large body movements, no extra dialogue, no BGM, no runny nose, no premature dropping of tears.\" Ban the exact ways this scene can collapse.","o":"archivo"},"4340f22ac789":{"s":"video","a":"references/seedance-25.md","l":225,"t":"Always attach the incantation: **\"prohibit rigid cutting, prohibit objects appearing out of thin air\"** — it is the official anti-jump-cut clause, repeated in every transition template.","o":"archivo"},"b93895a69273":{"s":"video","a":"references/seedance-25.md","l":227,"t":"Order-gate effects that must not fire early: \"The ink-wash effect must only appear AFTER 25 seconds, triggered by the 'click' sound — absolutely no premature appearance.\"","o":"archivo"},"e56653bec670":{"s":"video","a":"references/seedance-25.md","l":233,"t":"**Declare the physics regime up front.** \"Rain reflections on metal, water splashed by tires, and the specular refraction of exhaust flames must strictly obey real-world physics.\"","o":"archivo"},"809f55027421":{"s":"video","a":"references/seedance-25.md","l":234,"t":"**Narrate consequences, not just actions.** Tires kick up water curtains; the impact shatters the bridge into a spider-web pattern; the shockwave blows the rain away in a ring. Action chains where each step forces the next (\"hand grips jar → lid actually unscrews\") double as QA — a broken chain exposes a failed generation instantly.","o":"archivo"},"8870a91220dc":{"s":"video","a":"references/seedance-25.md","l":235,"t":"**Negatively constrain the known failure.** \"No soft-body or mollusk-like twisting of the mecha structure (must maintain metallic rigidity).\" \"The amber stays attached to the palm and must not clip through the fingers.\"","o":"archivo"},"5e9381b1532d":{"s":"video","a":"references/seedance-25.md","l":236,"t":"**Gate events on triggers.** \"Three seconds after she presses the button...\" / \"only when he says {now}...\" — triggers beat raw seconds for anything tied to performance.","o":"archivo"},"8dd832a85896":{"s":"video","a":"references/seedance-25.md","l":262,"t":"Any clip ≤30s extends by 4-30s per pass, nested repeatedly, **hard ceiling 60s**. The new prompt applies only to the appended segment; original frames are untouched. Required verbs: extend forward / extend backward / continue.","o":"archivo"},"324bcf02f62b":{"s":"video","a":"references/seedance-25.md","l":275,"t":"Backward (prepend a beginning): describe the preceding events, then define @Video 1's **first frame as the extension's explicit end state**. Gotcha: materials that belong to the source video only must be flagged — \"<X> must not appear early in the backward extension\" — or later characters leak into the past.","o":"archivo"},"3cc2915d07c9":{"s":"video","a":"references/seedance-25.md","l":279,"t":"Community-proven minimal extension prompt: \"Extend the video. Keep character identity, facial structure, body proportions, lighting, art style, and the space fully unchanged. Only change camera movement; do not redesign character or action.\"","o":"archivo"},"f0315e2411a6":{"s":"video","a":"references/seedance-25.md","l":285,"t":"**Timestamped** (1-minute ambient pieces): windowed beats with per-window bans — \"0-20s (quiet opening): fixed camera... no shake, no characters enter, hard cuts prohibited.\"","o":"archivo"},"ed4fbf774ee8":{"s":"video","a":"references/seedance-25.md","l":294,"t":"**Coarse blockout** — primitive geometry as a \"dynamic skeleton\" (trajectories, blocking, camera path, cuts, light changes). **Map every primitive to a reference**: \"The tall cylinder in @Video 1 corresponds to <Guide>. The rectangular block corresponds to <Display Cart>.\" Exclude the render style: \"Do not use its gray geometry or empty scene.\" Best practice: **no limbed or winged models in coarse","o":"archivo"},"7887bf99374c":{"s":"video","a":"references/seedance-25.md","l":295,"t":"**Fine blockout** — complete 3D animation; the model re-renders materials, color and style only: \"@Video 1 is a fine blockout reference. Preserve structure, action, spatial layout, camera position, camera movement, and cuts. Do not use its original gray materials or empty background. Re-render <subject> as <final subject>...\" **Clean the viewport capture first**: remove path lines, coordinate axes","o":"archivo"},"c8f9182dab48":{"s":"video","a":"references/seedance-25.md","l":306,"t":"**Storyboard grid as input**: one image, ≤15 panels official (practitioners have pushed 50), clean line art, minimal text. Declare the reading order and exclude the style: \"@Image 1 provides a 12-panel storyboard grid for shot order and approximate composition. Read it left to right, top to bottom. Do not use the grid's line-art style, text labels, or placeholder characters.\" Then `Shot 1: ... Sho","o":"auditoria"},"dbf4503191cb":{"s":"video","a":"references/seedance-25.md","l":307,"t":"**Multi-keyframe sequences**: \"Use @Image 1 through @Image N as keyframes in this order\", one key state per image. Independent images align better than a grid. Keyframes control stage order and key states, not exact frames.","o":"archivo"},"884b4b40911e":{"s":"video","a":"references/seedance-25.md","l":308,"t":"**First + last frame** works inside omni-reference mode — declare each anchor separately (\"@Image 1 is the first frame... @Image 2 is the last frame...\"), never jointly. Same aspect ratio required.","o":"archivo"},"877300b2ba56":{"s":"video","a":"references/seedance-25.md","l":314,"t":"Fix. Per-subject binding (section 5) + explicit differentiation: \"Their movements are not synchronized. Clothing colors, hairstyles, and facial features must all be distinct. No identical clones in the background.\"","o":"archivo"},"3b48069bb705":{"s":"video","a":"references/seedance-25.md","l":329,"t":"2.5 errs by commission: it completes more instructions than rivals but may cut freely even when told \"one continuous take\". Fix. \"One continuous shot, no cuts of any kind\" + a camera path that never motivates a cut; if montage keeps leaking in, drop to a 10-15s window where one-takes are stable.","o":"archivo"},"6eafd4ebaa95":{"s":"video","a":"references/seedance-25.md","l":336,"t":"Costs are real: a 30s/720p generation on Jimeng runs ~500-700 credits. Production budgets must assume re-rolls, extensions and segment reshoots — fix with edit/extend/reshoot instead of full regeneration whenever possible. Draft at 480p, finish at 720p.","o":"archivo"},"0395ddb6bd06":{"s":"video","a":"references/seedance.md","l":56,"t":"**Not 2.5 syntax.** On 2.5, duration / aspect ratio / resolution are set on the generation page or via API and do not belong in the prompt (exception: Ultra Long mode restates duration and ratio at the top — see `seedance-25.md` §2).","o":"archivo"},"73905921cedf":{"s":"video","a":"references/seedance.md","l":62,"t":"Seedance does not render abstractions. It renders **physical specifics**. Every adjective must be a sensory fact. Every emotion must be a body. Every shot must own at least three concrete details:","o":"archivo"},"a78b8143dfae":{"s":"video","a":"references/seedance.md","l":64,"t":"**One environmental pressure.** Cold blue refrigerator light. Steam off boiling water. Wet asphalt. Flickering fluorescent. Dripping tap. Curtain breathing in the AC.","o":"archivo"},"809fb4ebddce":{"s":"video","a":"references/seedance.md","l":65,"t":"**One physical micro-action.** Jaw locks. Finger taps the counter. Knuckles whiten on the fork. Lips press into a line. He swallows hard.","o":"archivo"},"659a2eb38201":{"s":"video","a":"references/seedance.md","l":66,"t":"**One sound anchor or visual motif.** Stomach growl at 2.3s. Reflection in the dark phone screen. Rain hitting the same windowpane.","o":"archivo"},"ae09790a4e9b":{"s":"video","a":"references/seedance.md","l":70,"t":"Banned, lazy phrasing that produces mush:","o":"archivo"},"e30cec365a82":{"s":"video","a":"references/seedance.md","l":92,"t":"Write in full sentences, not tags. Seedance prefers clear grammatical prose. For dramatic / multi-shot / character-locked work, **use the production-grade skeleton in section 6 instead.**","o":"archivo"},"2d5229cb5344":{"s":"video","a":"references/seedance.md","l":96,"t":"Use this for any dramatic piece, multi-shot ad, music-video segment, or character-locked clip. Each block answers a specific failure mode. Skipping a block reintroduces that failure.","o":"archivo"},"b9c780304835":{"s":"video","a":"references/seedance.md","l":156,"t":"For a 5-second multi-shot clip, the model performs best with **5 shot beats** following a dramatic micro-arc. Use this timing as the default scaffold:","o":"auditoria"},"c6a20928bc70":{"s":"video","a":"references/seedance.md","l":170,"t":"Seedance reads explicit cut markers inside a single prompt and generates distinct shots connected by visible cuts. This is its strongest card. Use it when you need montage in a single generation.","o":"archivo"},"c3c3d1047037":{"s":"video","a":"references/seedance.md","l":196,"t":"Use 2-3 shots per 5-second clip for tight cinematic montage, 4-5 shot beats only when each beat is short and physically distinct (see section 7). Hard cap: 5 shots per generation — beyond that the model drops or compresses shots. Size the duration to the shot count (4 shots need 10-15s, not 5s). Every shot must share an anchor with its neighbors — same character, same location, or same lighting re","o":"auditoria"},"d629ec5811b5":{"s":"video","a":"references/seedance.md","l":216,"t":"Seedance 2.0 accepts image references inline using `@img1`, `@img2`, etc. Use this to lock the protagonist's likeness across all shots in a multi-shot clip and across multiple stitched clips.","o":"archivo"},"e57740e558ac":{"s":"video","a":"references/seedance.md","l":226,"t":"The full identity block must follow the `@img1` mention. The model needs the textual description as a backup signal — the image alone drifts.","o":"archivo"},"80e69a894fcc":{"s":"video","a":"references/seedance.md","l":252,"t":"Workaround for 1.x/2.0. Always invert to positive phrasing. Instead of \"no yellow tones\" write \"cold blue-gray palette with desaturated skin tones.\" Instead of \"no distorted hands\" write \"anatomically correct hands with clear finger separation.\"","o":"archivo"},"a75221469baa":{"s":"video","a":"references/seedance.md","l":254,"t":"**Seedance 2.5 fixed this.** Direct bans are reliable: \"pure video, no subtitles, no background music\" actually suppresses them, and specific prohibition lists (\"no exaggerated crying, no fast cuts\") are a core part of the official 2.5 prompt structure. See `seedance-25.md` §7.","o":"archivo"},"71fec8821328":{"s":"video","a":"references/seedance.md","l":258,"t":"When using a reference image, DO NOT describe elements already visible in the image. The model sees it. Describe only motion and camera work. Re-describing static elements creates identity drift.","o":"archivo"},"6b50e2278180":{"s":"video","a":"references/seedance.md","l":273,"t":"Dialogue goes in **double quotes** on 1.5/2.0 — the model voices it, generates the voice and syncs lips to the cut. State the delivery: \"Play her line dry and a little proud, his quiet and worn out.\" **On 2.5, use the dedicated markers instead**: dialogue in `{ }`, SFX in `< >`, music in `( )`, titles in `【 】` (see `seedance-25.md` §4).","o":"archivo"},"f1f0fcdff995":{"s":"video","a":"references/seedance.md","l":282,"t":"Fix. Add explicit \"Cut to\" markers. Say \"multi-shot sequence with visible hard cuts. Do not generate a single continuous take.\"","o":"archivo"},"27ee9fc25b00":{"s":"video","a":"references/seedance.md","l":294,"t":"Fix. Use positive substitutes. Seedance 1.0 has no negative parser.","o":"archivo"},"f4c2c207fbb8":{"s":"video","a":"references/seedance.md","l":306,"t":"Fix. Apply the Details Law (section 4). Audit your draft: every shot must have one environmental pressure, one micro-action, one sound or visual motif anchor. Replace adjectives like \"dramatic\", \"intense\", \"beautiful\" with concrete physical facts.","o":"archivo"},"e7caec8627aa":{"s":"video","a":"references/seedance.md","l":310,"t":"After the 2026 deepfake crackdown, 2.0 aggressively filters human faces, helmets, sunglasses, and anything resembling protected IP or celebrity likeness. Fix. Route face-heavy drama to Seedance 2.5 (realistic humans are its headline feature), 1.5 Pro, Kling, or Veo; keep 2.0 for scenes, architecture, product and montage work. Use only owned or synthetic character references — the IP/celebrity filt","o":"archivo"},"31550b84c066":{"s":"video","a":"references/seedance.md","l":314,"t":"A 15s narrative is **never** one prompt. It is three self-contained 5-second prompts, each with the full character lock, the full visual style, the full audio block, and a different dramatic function. Stitch in the editor.","o":"auditoria"},"dd071e4f1adc":{"s":"video","a":"references/seedance.md","l":401,"t":"For dramatic, multi-shot, character-locked, or stitched-clip work — always use the 11-block production-grade skeleton from section 6.","o":"archivo"},"1eff4afae0c5":{"s":"video","a":"references/universal-rules.md","l":9,"t":"The non-negotiable. Details intensify emotion (Details Law)","o":"archivo"},"90c9d01c7da9":{"s":"video","a":"references/universal-rules.md","l":33,"t":"**One environmental pressure.** Cold blue refrigerator light. Steam off boiling water. Wet asphalt. Flickering fluorescent. Dripping tap. Curtain breathing in the AC. (Kurosawa: weather is a character. See `dramaturgy.md` §9.)","o":"archivo"},"3da18291f908":{"s":"video","a":"references/universal-rules.md","l":34,"t":"**One physical micro-action.** Jaw locks. Knuckles whiten on the fork. Lips press into a line. He swallows hard. Fingers curl against the doorframe. (Show, not tell — the body is the only place where feelings render.)","o":"archivo"},"01e778de1f4c":{"s":"video","a":"references/universal-rules.md","l":35,"t":"**One sound anchor or visual motif.** Stomach growl at 2.3s. Reflection in a darkened phone screen. Rain on the same windowpane. A single fluorescent flicker before each cut.","o":"archivo"},"d9efc3ad4bfb":{"s":"video","a":"references/universal-rules.md","l":39,"t":"Words that do not render and mark the writer being lazy:","o":"archivo"},"a4cd347f4b1e":{"s":"video","a":"references/universal-rules.md","l":85,"t":"Do not stack three camera moves in a 5-second clip. Pick one dominant move (dolly-in, pan, tracking, static). Layer a subtle micro-adjustment if needed (slight handheld shake, gentle rack focus). More than that produces visual chaos.","o":"archivo"},"c1d814f8c059":{"s":"video","a":"references/universal-rules.md","l":104,"t":"Identity block must include: face shape, eye color, skin tone. Hair color, length, style. Facial hair. Exact clothing items. Distinctive accessories.","o":"auditoria"},"e24b10c311e9":{"s":"video","a":"references/universal-rules.md","l":122,"t":"\"Loneliness\" does not render. \"A man sitting alone, shoulders collapsed, face lit by blue phone glow, empty bottles on the table\" does.","o":"archivo"},"9373adbe6c11":{"s":"video","a":"references/universal-rules.md","l":130,"t":"Most models work in 5-10 second clips. Longer narratives live in multiple clips stitched in the editor. Do not cram a 30-second story into a 5-second prompt.","o":"archivo"},"adbe90385564":{"s":"video","a":"references/universal-rules.md","l":154,"t":"Before returning the final prompt to the user, audit every shot. Each shot must carry at least one of each:","o":"archivo"},"75ec08f6c7e0":{"s":"video","a":"references/universal-rules.md","l":156,"t":"Environmental pressure (lighting, weather, surface, sound of the room).","o":"archivo"},"6f2d9a2fd7ba":{"s":"video","a":"references/universal-rules.md","l":157,"t":"Physical micro-action on the body (jaw, hand, breath, eye, gesture).","o":"archivo"},"e2b9c51c5ef7":{"s":"video","a":"references/universal-rules.md","l":158,"t":"Sound anchor or recurring visual motif tied to the emotional spine.","o":"archivo"},"f7ff7d98a4a9":{"s":"video","a":"references/universal-rules.md","l":160,"t":"If a shot has zero, fix it before sending. If a shot has only one, ask whether you can make it two without bloat. The strongest prompts in this skill's worked examples always have all three.","o":"archivo"},"51c07299485c":{"s":"video","a":"references/universal-rules.md","l":166,"t":"Wherever a model accepts reference assets (Seedance `@Image/@Video/@Audio`, Kling Element Binding and Omni references, Veo ingredients), **every asset gets an explicit role written in the prompt**: what it defines (appearance, motion, voice, scene, camera path) and what to ignore (\"Do not use the image background\", \"Do not use the people in the image\").","o":"archivo"},"2e0a56484152":{"s":"video","a":"references/universal-rules.md","l":168,"t":"Bind each subject individually: \"<Character A> corresponds to @Image 1 — use only the appearance, hairstyle, and clothing.\" Never the collective form \"@Images 1 through 4 define four characters respectively\" — it does not state which is which.","o":"archivo"},"21023b368ec1":{"s":"video","a":"references/universal-rules.md","l":169,"t":"Do not restate what a reference already defines. If a video reference carries the motion, name only the attributes to inherit; re-describing every action fights the reference.","o":"archivo"},"d1794addd647":{"s":"video","a":"references/universal-rules.md","l":178,"t":"The core subject that must survive every shot.","o":"archivo"},"0196c3f7220c":{"s":"video","a":"references/universal-rules.md","l":179,"t":"The key shots that must appear.","o":"archivo"},"da70b123efd4":{"s":"video","a":"references/universal-rules.md","l":180,"t":"The transitions where the model may freestyle.","o":"archivo"},"e21763705dd8":{"s":"video","a":"references/universal-rules.md","l":181,"t":"The mandatory final frame.","o":"archivo"},"dfcbb6dd0684":{"s":"video","a":"references/veo.md","l":95,"t":"Use labels `Audio:`, `Says:`, `SFX:` to separate sound direction from visual direction. The model needs an explicit signal that audio should be generated.","o":"archivo"},"a45ee38936f8":{"s":"video","a":"references/veo.md","l":99,"t":"Veo parses structured JSON. This prevents \"concept bleed\" where describing mood accidentally changes object colors. Use JSON for complex scenes with strict continuity needs.","o":"archivo"},"01a57763de37":{"s":"video","a":"references/veo.md","l":165,"t":"Complex props that must stay the same color and size.","o":"archivo"},"1c400db686fb":{"s":"video","a":"references/veo.md","l":176,"t":"Do not re-describe static elements.","o":"archivo"},"402a936cf3fe":{"s":"video","a":"references/veo.md","l":197,"t":"Use when you need a specific character in a specific place with a specific object.","o":"archivo"},"1a0831f5ce00":{"s":"video","a":"references/veo.md","l":207,"t":"Fix. Add explicit `Audio:`, `SFX:`, or `Says:` labels. Do not assume the model will infer audio from visual description.","o":"archivo"},"1dc7c87def16":{"s":"visual-asset-critic","a":"SKILL.md","l":24,"t":"**Two artifacts from every review, always both:** a human-readable markdown critique (the primary surface) and a machine-readable critique JSON (so a pipeline can gate on the verdict instead of parsing prose). The JSON is detailed in Step 6; it never replaces the markdown.","o":"archivo"},"c8195d96aaff":{"s":"visual-asset-critic","a":"SKILL.md","l":77,"t":"If you can't establish intent in one sentence, ask. Don't critique blind.","o":"archivo"},"0aebfb67e4fd":{"s":"visual-asset-critic","a":"SKILL.md","l":83,"t":"**Brand Lock**, does it respect palette, mood, \"never\" list?","o":"auditoria"},"3236a31aecea":{"s":"visual-asset-critic","a":"SKILL.md","l":84,"t":"**Series Lock**, does it match character/environment/lighting anchors?","o":"archivo"},"79f9fd6178a0":{"s":"visual-asset-critic","a":"SKILL.md","l":85,"t":"**Shot Spec**, does framing/angle/composition match the spec?","o":"auditoria"},"024638f7f93d":{"s":"visual-asset-critic","a":"SKILL.md","l":86,"t":"**Composition**, does it reserve space for on-screen text if applicable?","o":"auditoria"},"d0476aaa14d5":{"s":"visual-asset-critic","a":"SKILL.md","l":87,"t":"**Technical**, skin texture, hands, eyes, anatomy, AI artifacts?","o":"auditoria"},"4254cbeb01a9":{"s":"visual-asset-critic","a":"SKILL.md","l":88,"t":"**Continuity**, if previous shots in the series are available, does it match?","o":"archivo"},"4dabd7bdc618":{"s":"visual-asset-critic","a":"SKILL.md","l":94,"t":"For every \"not working\" point, the critique must say what to do about it. Three buckets:","o":"archivo"},"7eac9caa0ac8":{"s":"visual-asset-critic","a":"SKILL.md","l":102,"t":"**Re-roll required**, no prompt fix will help; the generator just produced a bad sample. Budget 2–3 attempts:","o":"archivo"},"c24705b39ede":{"s":"visual-asset-critic","a":"SKILL.md","l":145,"t":"**Provenance, all of it required at 1.1.** A verdict is a claim about specific bytes. Name","o":"archivo"},"fd33b1fe4a83":{"s":"visual-asset-critic","a":"SKILL.md","l":182,"t":"**Gating rule, the verdict is derived from severities, not chosen freely.** This guarantees the markdown verdict and the JSON verdict always agree:","o":"archivo"},"583d5f400a46":{"s":"visual-asset-critic","a":"SKILL.md","l":224,"t":"\"Looks great\" / \"feels off\" without specifics is not a critique. Every observation must reference something in the image (composition, color, anatomy, lighting direction, etc.).","o":"archivo"},"0cde22e1a93c":{"s":"visual-asset-critic","a":"SKILL.md","l":232,"t":"If the brief was \"founder at laptop, calm mood\" and the generation delivered exactly that, don't note that \"the room could be more visually interesting.\" That's scope creep, not critique.","o":"archivo"},"5b837820df26":{"s":"visual-asset-critic","a":"SKILL.md","l":236,"t":"Some failures (mangled hands, weird eye reflections, jewelry shimmer) are known generator weaknesses. Surface them as such, don't pretend a different prompt will fix them. Recommend re-roll or post.","o":"archivo"},"a221a716e952":{"s":"visual-asset-critic","a":"SKILL.md","l":240,"t":"Generation is one stage in a pipeline. If the image is 80% right and the gap is fixable in post, that's an ACCEPT with post notes. Don't send the user back to re-generate when an editor would handle it in 90 seconds.","o":"archivo"},"65ab63f3291c":{"s":"visual-asset-critic","a":"SKILL.md","l":276,"t":"If the verdict is REJECT, do not offer that. REJECT means a blocking issue or three or more","o":"archivo"},"c7b95c733b7f":{"s":"visual-asset-critic","a":"SKILL.md","l":281,"t":"Don't auto-revise. The user picks. The critique you just wrote is exactly what closes that","o":"archivo"},"147b5d10f118":{"s":"visual-asset-critic","a":"examples/worked-run/brand-lock.snapshot.md","l":40,"t":"never use stock photo aesthetic","o":"archivo"},"edb34335baee":{"s":"visual-asset-critic","a":"examples/worked-run/brand-lock.snapshot.md","l":41,"t":"never use AI uncanny faces","o":"auditoria"},"36f326b4fa1b":{"s":"visual-asset-critic","a":"examples/worked-run/brand-lock.snapshot.md","l":42,"t":"never over-saturate the cream background","o":"auditoria"},"6fcfbe5ad699":{"s":"visual-asset-critic","a":"examples/worked-run/brand-lock.snapshot.md","l":43,"t":"never use coral as a flood color (only as accent or signature periods)","o":"auditoria"},"e3d69437c2f6":{"s":"visual-asset-critic","a":"examples/worked-run/brand-lock.snapshot.md","l":44,"t":"never use em dashes in copy","o":"archivo"},"ff2826465af1":{"s":"visual-asset-critic","a":"examples/worked-run/brand-lock.snapshot.md","l":45,"t":"never use emojis in body copy","o":"archivo"},"bd1590a213fe":{"s":"visual-asset-critic","a":"examples/worked-run/brand-lock.snapshot.md","l":46,"t":"never use bullet points in narrative copy","o":"archivo"},"cf3ce4e1adaf":{"s":"visual-asset-critic","a":"examples/worked-run/brand-lock.snapshot.md","l":47,"t":"never use clip-art or generic icon sets","o":"auditoria"},"2ef7c79850da":{"s":"visual-asset-critic","a":"examples/worked-run/brand-lock.snapshot.md","l":48,"t":"never use hype words (\"game-changing\", \"revolutionary\", \"next-level\", \"comprehensive\")","o":"archivo"},"5d8f1227d198":{"s":"visual-asset-critic","a":"examples/worked-run/brand-lock.snapshot.md","l":49,"t":"never use exclamation points in headlines","o":"archivo"},"b1bf8c0bd438":{"s":"visual-asset-critic","a":"examples/worked-run/brand-lock.snapshot.md","l":50,"t":"never default to dark mode, light mode hybrid is the brand","o":"auditoria"},"2306baa11deb":{"s":"visual-asset-critic","a":"examples/worked-run/brand-lock.snapshot.md","l":51,"t":"never animate text with bouncing or wobbling, type-on, fade, or hard cut only","o":"auditoria"},"c2fbf1d46956":{"s":"visual-asset-critic","a":"examples/worked-run/brand-lock.snapshot.md","l":62,"t":"Warm filmic, muted teal shadows. Slight grain. Cream highlights, deep navy/charcoal shadows, never crushed. Reminiscent of Kodak Portra 400 with a slight digital cleanup.","o":"archivo"},"8cb896ae3ca7":{"s":"visual-asset-critic","a":"examples/worked-run/brand-lock.snapshot.md","l":66,"t":"Camera moves are minimal and deliberate. Default to static. When motion is used, slow push or slow pull only. Cuts on action, not on time. Type-on for emphasis, never bouncing or wobbling. Coral periods animate as a hard pop on signature beats. Transitions are hard cuts or 6-frame dissolves only.","o":"auditoria"},"a3fa0f352d46":{"s":"visual-asset-critic","a":"examples/worked-run/brand-lock.snapshot.md","l":74,"t":"prefer specific numbers over vague claims","o":"archivo"},"c1ee0d0b5a80":{"s":"visual-asset-critic","a":"examples/worked-run/brand-lock.snapshot.md","l":75,"t":"prefer present-tense over future-tense","o":"archivo"},"650d25a8d091":{"s":"visual-asset-critic","a":"examples/worked-run/brand-lock.snapshot.md","l":76,"t":"prefer \"operator\" over \"creator\", \"infrastructure\" over \"agency\"","o":"archivo"},"1e898f2c0308":{"s":"visual-asset-critic","a":"references/critique-rubric.md","l":59,"t":"Technical hard fails are almost always **re-roll required**. The prompt was probably fine; the generator just produced a bad sample. Budget 2–3 re-rolls.","o":"archivo"},"31afcb61a699":{"s":"visual-asset-critic","a":"references/critique-rubric.md","l":101,"t":"Soft fails are noted but don't change the verdict on their own. If you have three or more of","o":"archivo"},"788f1a8f5595":{"s":"visual-asset-critic","a":"references/critique-rubric.md","l":107,"t":"**Don't critique what wasn't asked**, if the spec didn't call for cinematic mood, don't say \"could be more cinematic\"","o":"archivo"},"8014a721e61b":{"s":"visual-asset-critic","a":"references/critique-rubric.md","l":108,"t":"**Don't pile-on once verdict is set**, if you're rejecting, list the issues that drive the rejection; don't list every cosmetic concern","o":"archivo"},"9b616f961fba":{"s":"visual-asset-critic","a":"references/critique-rubric.md","l":109,"t":"**Be specific, always**, \"lighting is off\" is not a critique; \"key light is camera-right but series_lock says camera-left\" is","o":"archivo"},"b1bf47b129ef":{"s":"visual-asset-critic","a":"references/critique-rubric.md","l":111,"t":"**Distinguish prompt failure from generator failure**, if the prompt was fine and the generator produced garbage hands, that's \"re-roll required\", not \"fix the prompt\"","o":"archivo"},"73fe57cd2392":{"s":"visual-prompt-forge","a":"SKILL.md","l":21,"t":"If the user wants to build a storyboard from scratch (no shots.json yet), use `storyboard-architect` first, then chain into this skill.","o":"archivo"},"30bbbcefca75":{"s":"visual-prompt-forge","a":"SKILL.md","l":53,"t":"**Brand Lock**, palette, type, mood, \"never\" list (constant across project)","o":"archivo"},"3a6fba22ac13":{"s":"visual-prompt-forge","a":"SKILL.md","l":54,"t":"**Series Lock**, character/environment/lighting anchors (constant across storyboard)","o":"archivo"},"ea1a9a227c90":{"s":"visual-prompt-forge","a":"SKILL.md","l":55,"t":"**Shot Spec**, framing, angle, motion, subject (per shot)","o":"archivo"},"d584b5f6dd31":{"s":"visual-prompt-forge","a":"SKILL.md","l":56,"t":"**Text Layer**, **never in the prompt**, composited separately","o":"archivo"},"2ad7d2bd5837":{"s":"visual-prompt-forge","a":"SKILL.md","l":57,"t":"**Generator Adapter**, model-specific syntax wrapper","o":"archivo"},"409086978069":{"s":"visual-prompt-forge","a":"SKILL.md","l":100,"t":"Each adapter file documents the prompting style, parameter syntax, and known pitfalls for that generator. You **must** read the adapter before writing prompts for it. Don't guess from training data, image-gen syntax has churned multiple times.","o":"archivo"},"a8d68a296084":{"s":"visual-prompt-forge","a":"SKILL.md","l":122,"t":"**Strip any on_screen_text reference**, text never goes in the prompt","o":"archivo"},"24d0e917035e":{"s":"visual-prompt-forge","a":"SKILL.md","l":261,"t":"Colors come from the series_lock color_grade and the brand_lock palette. They get rendered into the prompt by the adapter. Don't write \"deep navy blazer\" in the shot subject if \"deep navy\" is already in the palette, that's a duplicated description and produces oversaturation.","o":"auditoria"},"4a9a9f1d1b5a":{"s":"visual-prompt-forge","a":"adapters/flux.md","l":36,"t":"Flux handles **80–150 words** comfortably. Don't pad, but you have headroom Midjourney doesn't.","o":"archivo"},"cf6ea7ae4157":{"s":"visual-prompt-forge","a":"adapters/flux.md","l":48,"t":"`shallow DOF` | `Shot at f/1.8 with shallow depth of field, background softly out of focus.`","o":"archivo"},"90c1b290af77":{"s":"visual-prompt-forge","a":"adapters/flux.md","l":90,"t":"**Don't write \"highly detailed, 4k, masterpiece\"**, these are Stable Diffusion crutches. Flux ignores them and the line burns tokens","o":"archivo"},"c55494cbbad4":{"s":"visual-prompt-forge","a":"adapters/flux.md","l":91,"t":"**Don't use weight syntax `(thing:1.4)`**. Flux 2 doesn't support it; Flux 1.1 partially does. Stick to natural language","o":"archivo"},"0447e389826e":{"s":"visual-prompt-forge","a":"adapters/flux.md","l":92,"t":"**Don't enable prompt upsampling for series work**, fal.ai's auto-rewrite produces inconsistent shots","o":"archivo"},"d070363f06ff":{"s":"visual-prompt-forge","a":"adapters/flux.md","l":93,"t":"**Don't include text content**, even if Flux 2 handles text better than Flux 1.1, composite separately for editability","o":"archivo"},"bc7cb8df5ee2":{"s":"visual-prompt-forge","a":"adapters/flux.md","l":94,"t":"**Don't omit the photoreal closing line**, the \"no AI artifacts\" anchor measurably reduces the AI-look","o":"archivo"},"3e22b4c62b1b":{"s":"visual-prompt-forge","a":"adapters/gpt-image.md","l":38,"t":"GPT Image handles **150–300 words** comfortably. Longer than other generators. Use the headroom for explicit spatial descriptions.","o":"archivo"},"4e37b6108b10":{"s":"visual-prompt-forge","a":"adapters/gpt-image.md","l":46,"t":"\"The subject's shoulders are angled 30 degrees toward the camera, face turned to look at the off-frame light source.\"","o":"auditoria"},"20ebea9d8a54":{"s":"visual-prompt-forge","a":"adapters/gpt-image.md","l":48,"t":"Use this when the shot's composition is load-bearing.","o":"archivo"},"226a236b4dcc":{"s":"visual-prompt-forge","a":"adapters/gpt-image.md","l":75,"t":"GPT Image handles text-in-image at roughly 95% accuracy, second only to Ideogram. When text is required:","o":"auditoria"},"fd93590ae5d9":{"s":"visual-prompt-forge","a":"adapters/gpt-image.md","l":86,"t":"**Don't write Midjourney-style comma stacks**. GPT Image parses them as a list of disconnected concepts","o":"archivo"},"b5fa2fb924bd":{"s":"visual-prompt-forge","a":"adapters/gpt-image.md","l":87,"t":"**Don't omit spatial language when the shot has specific composition**, you're paying for the model's strength; use it","o":"archivo"},"e1f3ed8e587b":{"s":"visual-prompt-forge","a":"adapters/gpt-image.md","l":88,"t":"**Don't pile too many objects**, five or fewer distinct elements per scene; more degrades fidelity","o":"archivo"},"a6bec722c41f":{"s":"visual-prompt-forge","a":"adapters/gpt-image.md","l":89,"t":"**Don't include `--ar` flags or weight syntax**. GPT Image ignores them","o":"archivo"},"d4f119799fc1":{"s":"visual-prompt-forge","a":"adapters/gpt-image.md","l":90,"t":"**Don't forget that GPT Image's \"AI look\" is real**, the closing \"natural skin texture, no AI rendering artifacts\" line meaningfully helps but isn't a complete fix. For pure photoreal, Flux is still stronger","o":"archivo"},"a5926981e848":{"s":"visual-prompt-forge","a":"adapters/hailuo.md","l":66,"t":"**Don't enable the prompt optimizer for series work.** Auto-rewrite breaks shot-to-shot consistency.","o":"archivo"},"c52dc68d0daf":{"s":"visual-prompt-forge","a":"adapters/hailuo.md","l":67,"t":"**Don't stack two camera moves.** One move per shot.","o":"archivo"},"4755505de7d6":{"s":"visual-prompt-forge","a":"adapters/hailuo.md","l":68,"t":"**Don't include text content.** Composite captions in post.","o":"auditoria"},"88ac8d8506e0":{"s":"visual-prompt-forge","a":"adapters/ideogram.md","l":15,"t":"Use when the on-screen text is meant to appear as part of the image itself, a poster headline, a sign in the scene, a packaging label. This is the only case where a generator prompt contains the text content.","o":"auditoria"},"73aaed94b890":{"s":"visual-prompt-forge","a":"adapters/ideogram.md","l":30,"t":"The exact text must be in straight double-quotes. Ideogram parses these as the text-render target.","o":"auditoria"},"8ad2673a7cf6":{"s":"visual-prompt-forge","a":"adapters/ideogram.md","l":91,"t":"**Don't trust magic_prompt**, it auto-rewrites and produces inconsistent shots across a series","o":"archivo"},"83c574fc9ce5":{"s":"visual-prompt-forge","a":"adapters/ideogram.md","l":92,"t":"**Don't pile multiple text elements in one prompt**. Ideogram handles one text element well, two becomes lottery, three is broken","o":"auditoria"},"e0e022e50a9e":{"s":"visual-prompt-forge","a":"adapters/ideogram.md","l":
