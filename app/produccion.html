93,"t":"**Don't use cursive/decorative fonts**, even Ideogram fails on these. Sans-serif and clean serif are reliable","o":"auditoria"},"22d09b130cbd":{"s":"visual-prompt-forge","a":"adapters/ideogram.md","l":94,"t":"**Don't forget seed**, for any series work, lock the seed at the storyboard level","o":"archivo"},"34c9774072b9":{"s":"visual-prompt-forge","a":"adapters/kling.md","l":15,"t":"Camera motion goes **first**. This is the inverse of image generators where camera is implied. With video the camera's behaviour is the first thing the model must understand.","o":"archivo"},"a96d5275630a":{"s":"visual-prompt-forge","a":"adapters/kling.md","l":26,"t":"`negative_prompt` | per series | Supported. Use to suppress drift, e.g. `extra fingers, warped face`","o":"archivo"},"c05a37e6c694":{"s":"visual-prompt-forge","a":"adapters/kling.md","l":37,"t":"Kling handles **80–150 words** comfortably. Motion description adds a beat over a still prompt; do not pad past it.","o":"archivo"},"dd11b5da1036":{"s":"visual-prompt-forge","a":"adapters/kling.md","l":73,"t":"Use `start_image` from the previous shot's accepted final frame to chain a sequence.","o":"archivo"},"1e43dbde9ec3":{"s":"visual-prompt-forge","a":"adapters/kling.md","l":75,"t":"Do not flip lighting direction between consecutive shots (window-left stays window-left).","o":"archivo"},"5996725c4119":{"s":"visual-prompt-forge","a":"adapters/kling.md","l":80,"t":"**Don't put camera motion at the end.** Kling parses motion best as the leading instruction.","o":"archivo"},"28b092664be0":{"s":"visual-prompt-forge","a":"adapters/kling.md","l":81,"t":"**Don't request multiple camera moves in one shot.** Pick one; compound moves break.","o":"archivo"},"9d51ba168710":{"s":"visual-prompt-forge","a":"adapters/kling.md","l":82,"t":"**Don't describe motion faster than the duration allows.** A slow dolly over 5s is plausible; over 1s it is jitter.","o":"archivo"},"3d67beea0470":{"s":"visual-prompt-forge","a":"adapters/kling.md","l":83,"t":"**Don't include text content.** Video text rendering is unreliable; composite or animate text in post.","o":"auditoria"},"35ad63b182a1":{"s":"visual-prompt-forge","a":"adapters/midjourney.md","l":43,"t":"`shallow DOF` | `shallow depth of field, f/1.8, bokeh background`","o":"archivo"},"c51e98883ae8":{"s":"visual-prompt-forge","a":"adapters/midjourney.md","l":97,"t":"**Don't use \"AI\" or \"rendered\"**, produces stylized outputs that look generated","o":"archivo"},"e6bae7347048":{"s":"visual-prompt-forge","a":"adapters/midjourney.md","l":98,"t":"**Don't over-stack adjectives**, three adjectives per noun phrase max","o":"archivo"},"f85b78ac44b0":{"s":"visual-prompt-forge","a":"adapters/midjourney.md","l":99,"t":"**Don't include text content**, even if the shot has `on_screen_text`, leave it out. Composited separately.","o":"archivo"},"8452bcb3abe4":{"s":"visual-prompt-forge","a":"adapters/midjourney.md","l":100,"t":"**Don't use `--c` for series work**, chaos kills consistency","o":"archivo"},"3ac7c1186c62":{"s":"visual-prompt-forge","a":"adapters/midjourney.md","l":101,"t":"**Don't change `--seed` mid-storyboard**, set once at series_lock level","o":"archivo"},"43331142e7ea":{"s":"visual-prompt-forge","a":"adapters/nano-banana.md","l":101,"t":"**Don't use Midjourney-style flag syntax**. Nano Banana ignores `--ar`, expects `aspectRatio` parameter","o":"archivo"},"c169c881a0e6":{"s":"visual-prompt-forge","a":"adapters/nano-banana.md","l":102,"t":"**Don't expect Midjourney-level aesthetic by default**. Nano Banana is a workhorse, not a stylist. Stack mood adjectives explicitly","o":"archivo"},"03aa46d144b5":{"s":"visual-prompt-forge","a":"adapters/nano-banana.md","l":103,"t":"**Don't pile multiple modifications in one image-to-image prompt**, one change per pass produces cleaner results","o":"archivo"},"c4812cc96bc2":{"s":"visual-prompt-forge","a":"adapters/nano-banana.md","l":104,"t":"**Don't forget the \"preserve\" clause in image-to-image**, without it, Nano Banana treats the reference as loose inspiration and drifts","o":"archivo"},"5fc1cc954fb0":{"s":"visual-prompt-forge","a":"adapters/nano-banana.md","l":105,"t":"**Don't include text content in image prompts**, composite separately; text rendering is mediocre","o":"archivo"},"07771e486a77":{"s":"visual-prompt-forge","a":"adapters/seedance.md","l":74,"t":"**Don't force unrelated beats into one sequence.** Multi-shot is for shots that genuinely belong to one take.","o":"archivo"},"cee8c4cd6183":{"s":"visual-prompt-forge","a":"adapters/seedance.md","l":75,"t":"**Don't write more than ~4 cuts per generation.** Consistency degrades past that; split and assemble in edit.","o":"archivo"},"e84b5c0448b9":{"s":"visual-prompt-forge","a":"adapters/seedance.md","l":76,"t":"**Don't vary the character anchor between cuts.** Restate it once for the whole sequence, verbatim.","o":"archivo"},"98d91e461feb":{"s":"visual-prompt-forge","a":"adapters/seedance.md","l":77,"t":"**Don't include text content.** Composite captions from `text-overlays.json` in post.","o":"auditoria"},"750cf06a6b5c":{"s":"visual-prompt-forge","a":"adapters/seedance.md","l":78,"t":"**Don't stack two camera moves inside one cut.** One move per cut.","o":"archivo"},"5c181b49f9d4":{"s":"visual-prompt-forge","a":"adapters/seedream.md","l":38,"t":"**40–70 words per prompt**. Shorter than most. Don't pad.","o":"archivo"},"b58550816f3f":{"s":"visual-prompt-forge","a":"adapters/seedream.md","l":75,"t":"**Don't vary** the lighting language between shots, series_lock string in, no paraphrasing","o":"archivo"},"735b1edeccc3":{"s":"visual-prompt-forge","a":"adapters/seedream.md","l":80,"t":"**Don't write paragraphs**. Seedream wants comma-separated phrases","o":"archivo"},"8c221aa40298":{"s":"visual-prompt-forge","a":"adapters/seedream.md","l":81,"t":"**Don't use `--ar` syntax**, pass aspect_ratio as a parameter","o":"archivo"},"679f8c322dba":{"s":"visual-prompt-forge","a":"adapters/seedream.md","l":82,"t":"**Don't include text content**, text rendering is poor; composite separately","o":"archivo"},"3de5ebeb511c":{"s":"visual-prompt-forge","a":"adapters/seedream.md","l":83,"t":"**Don't expect Midjourney aesthetic**. Seedream produces clean but less art-directed output","o":"archivo"},"14306fa1f1c7":{"s":"visual-prompt-forge","a":"adapters/seedream.md","l":84,"t":"**Don't skip the seed lock for series work**, without it, character consistency breaks","o":"archivo"},"c962c96606da":{"s":"visual-prompt-forge","a":"adapters/veo.md","l":76,"t":"**Don't overrun the duration with dialogue.** A line that needs 12s of speech will clip or rush at 8s.","o":"archivo"},"1087e186fed5":{"s":"visual-prompt-forge","a":"adapters/veo.md","l":77,"t":"**Don't put on-screen text in the prompt.** Spoken lines are fine; rendered captions still come from `text-overlays.json` in post.","o":"auditoria"},"0acb882ac4aa":{"s":"visual-prompt-forge","a":"adapters/veo.md","l":78,"t":"**Don't stack two camera moves.** One move per shot.","o":"archivo"},"561e4601866e":{"s":"visual-prompt-forge","a":"adapters/veo.md","l":79,"t":"**Don't let Veo's auto-audio fight a post audio bed.** Pick one owner of sound per shot.","o":"archivo"},"00ad95b7807d":{"s":"visual-prompt-forge","a":"references/consistency-locks.md","l":33,"t":"Same principle for `series_lock.lighting`. Lighting direction in particular is critical, flipping window-left to window-right between shots produces obvious cuts where there shouldn't be any.","o":"archivo"},"199cfb9ab91d":{"s":"visual-prompt-forge","a":"references/consistency-locks.md","l":60,"t":"Generate the hero shot first (any shot, usually `shot_01` or whichever is most defining)","o":"auditoria"},"b2e806d6105a":{"s":"visual-prompt-forge","a":"references/consistency-locks.md","l":61,"t":"Use that image as the reference for every subsequent shot","o":"auditoria"},"14c534d5e7f2":{"s":"visual-prompt-forge","a":"references/consistency-locks.md","l":62,"t":"Each subsequent prompt has the verbatim character anchor PLUS the reference image link","o":"auditoria"},"926508430703":{"s":"visual-prompt-forge","a":"references/consistency-locks.md","l":70,"t":"**This is the most effective lock for character consistency** in 2026. Use it whenever the storyboard features the same person across multiple shots.","o":"archivo"},"a0d393395e3a":{"s":"visual-prompt-forge","a":"references/consistency-locks.md","l":74,"t":"When the storyboard has a distinctive visual style (specific film stock, specific lighting school, specific color theory), use a style reference image:","o":"archivo"},"4140ed69949c":{"s":"visual-prompt-forge","a":"references/consistency-locks.md","l":84,"t":"A subtle one that breaks scenes when violated. If `series_lock.lighting` says \"soft natural side-light, large window LEFT\", then every shot's lighting must respect that direction.","o":"archivo"},"20b3434a9a5d":{"s":"visual-prompt-forge","a":"references/consistency-locks.md","l":86,"t":"When a shot reverses character orientation (e.g., over-the-shoulder reverse), update the rationale to acknowledge the lighting flip:","o":"archivo"},"3b984b2349a3":{"s":"visual-prompt-forge","a":"references/consistency-locks.md","l":113,"t":"A few things people try that don't actually fix consistency:","o":"archivo"},"0f136ad02a4a":{"s":"visual-prompt-forge","a":"references/consistency-locks.md","l":115,"t":"**Adding \"consistent character\" or \"same person\" to the prompt**, generators don't read meta-instructions","o":"archivo"},"985e93f22844":{"s":"visual-prompt-forge","a":"references/consistency-locks.md","l":116,"t":"**Numbering shots in the prompt** (\"shot 3 of 7, same as before\"), generators don't have memory across calls","o":"archivo"},"dd6e04a7a56e":{"s":"visual-prompt-forge","a":"references/consistency-locks.md","l":118,"t":"**Asking for \"exactly the same\"**, there is no such thing in stateless image gen; you reduce drift, you don't eliminate it","o":"archivo"},"bfb6f1d9e6b2":{"s":"visual-prompt-forge","a":"references/consistency-locks.md","l":120,"t":"Accept that some shots will need re-rolls. Budget for it. The locks reduce the failure rate; they don't eliminate it.","o":"auditoria"},"2757ce63d7e2":{"s":"visual-prompt-forge","a":"references/failure-modes.md","l":19,"t":"Verify brand-lock \"never\" list is being applied, if it includes \"no AI uncanny\", surface that into the prompt","o":"archivo"},"8f8dc623566a":{"s":"visual-prompt-forge","a":"references/failure-modes.md","l":20,"t":"Use Flux 2 Pro or Midjourney v7 instead of cheaper models for hero shots","o":"archivo"},"b826ad9667a2":{"s":"visual-prompt-forge","a":"references/failure-modes.md","l":37,"t":"Use reference image after the first successful shot","o":"archivo"},"717c03da642d":{"s":"visual-prompt-forge","a":"references/failure-modes.md","l":39,"t":"For Midjourney, use `--cref` with `--cw 50`","o":"archivo"},"6447bec15b56":{"s":"visual-prompt-forge","a":"references/failure-modes.md","l":53,"t":"The right answer is almost always: **don't put text in the prompt**. Composite separately from `text-overlays.json`.","o":"archivo"},"359736f73561":{"s":"visual-prompt-forge","a":"references/failure-modes.md","l":54,"t":"If text must be in-image (poster work), use Ideogram v3 with explicit override flag","o":"archivo"},"5945d25c9b90":{"s":"visual-prompt-forge","a":"references/failure-modes.md","l":56,"t":"Use simple fonts (sans-serif, clean serif), cursive and decorative fonts fail even on Ideogram","o":"archivo"},"ecb6a8e221f1":{"s":"visual-prompt-forge","a":"references/failure-modes.md","l":87,"t":"For GPT Image (best at spatial reasoning), use percentage references: \"subject at left 30% of frame\"","o":"archivo"},"982752f60d62":{"s":"visual-prompt-forge","a":"references/failure-modes.md","l":122,"t":"**Accept editorially when:** generation is close enough that retouching gets there. Don't burn API credits chasing perfect on-prompt.","o":"archivo"},"1f983ff0ee18":{"s":"visual-prompt-forge","a":"references/failure-modes.md","l":128,"t":"You've re-rolled the same shot 5+ times with no improvement → the prompt is fine; the model can't render this concept; pick a different shot or different generator","o":"archivo"},"12009aa60167":{"s":"visual-prompt-forge","a":"references/failure-modes.md","l":129,"t":"You're tweaking single words and hoping → you've hit prompt-level diminishing returns; move to image-to-image refinement (Nano Banana) or post-production","o":"archivo"},"4be94337bb02":{"s":"visual-prompt-forge","a":"references/failure-modes.md","l":130,"t":"The image is 80% right and the gap is editorial → ship to post and let the editor finish","o":"archivo"},"33fc833724e0":{"s":"visual-prompt-forge","a":"references/failure-modes.md","l":132,"t":"Generation is one stage in a pipeline. Don't try to make it the whole pipeline.","o":"archivo"},"bcaac139f9b7":{"s":"visual-prompt-forge","a":"references/prompt-anatomy.md","l":16,"t":"\"Never\" list (things this brand never does, e.g. \"no stock photo aesthetic\", \"no AI uncanny\", \"no over-saturated\", \"no shouting copy\")","o":"archivo"},"67037c4b307e":{"s":"visual-prompt-forge","a":"references/prompt-anatomy.md","l":60,"t":"**Never appears in image prompts** (except Ideogram Mode 2 with explicit override).","o":"archivo"},"e177c4f10a04":{"s":"visual-prompt-forge","a":"references/prompt-anatomy.md","l":64,"t":"**Editability.** Composited text can be revised without re-generating images.","o":"archivo"},"4c22b71ebf0a":{"s":"visual-prompt-forge","a":"references/prompt-anatomy.md","l":65,"t":"**Quality.** Even Ideogram and GPT Image (the best at text) produce typography that lags professional design tools.","o":"archivo"},"5f5e6ee4ad91":{"s":"visual-prompt-forge","a":"references/prompt-anatomy.md","l":66,"t":"**Animation.** Animated text needs After Effects / Remotion / CapCut. Static rendered text is dead-on-arrival for motion content.","o":"archivo"}},"meta":{"total":1153,"auditorias":343}}</script>
<script>
const D = JSON.parse(document.getElementById("datos").textContent);
const ET = D.etapas, TR = D.tracks, IDX = D.idx, PORCASO = D.porCaso, CASOS = D.casos;
const LS = "salaprod.v2";
const esc = s => s.replace(/[<>&]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));
// Las reglas vienen en markdown de los skills: **negrita** y `codigo` se rinden.
const md = s => esc(s).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
                      .replace(/`([^`]+)`/g, "<code>$1</code>");
let S = {track:"STANDARD", etapa:4, estado:{0:"cerrado",1:"cerrado",2:"cerrado",3:"curso"},
         tipo:null, origen:null, q:""};
try { Object.assign(S, JSON.parse(localStorage.getItem(LS)) || {}); } catch (e) {}
const guardar = () => { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} };
const ETQ = {pendiente:"Pendiente", curso:"En curso", cerrado:"Cerrado"};

const reglasDe = (e, tipo) => {
  const cs = tipo ? [tipo] : e.casos;
  return [...new Set(cs.flatMap(c => PORCASO[c] || []))].map(i => IDX[i]).filter(Boolean);
};
const enTrack = e => e.tracks.includes(S.track);

function riel(){
  document.getElementById("sub").textContent =
    `${D.meta.total} reglas · ${D.meta.auditorias} auditadas`;

  const t = document.getElementById("tracks"); t.innerHTML = "";
  Object.keys(TR).forEach(k => {
    const b = document.createElement("button");
    b.textContent = k; b.setAttribute("aria-pressed", S.track === k);
    b.onclick = () => { S.track = k;
      if (!enTrack(ET.find(x => x.n === S.etapa))) S.etapa = ET.find(enTrack).n;
      guardar(); pintar(); };
    t.appendChild(b);
  });
  const i = TR[S.track];
  document.getElementById("trackinfo").innerHTML =
    `<b class="mono">${esc(i.dur)}</b> · ${esc(i.narr)} · ${esc(i.rev)} rev.<br>
     <span style="color:var(--faint)">Etapas ${esc(i.etapas)}</span>`;

  const c = document.getElementById("etapas"); c.innerHTML = "";
  ET.forEach(e => {
    const es = S.estado[e.n] || "pendiente", fuera = !enTrack(e);
    const b = document.createElement("button");
    b.className = "stage"; b.dataset.estado = es; b.dataset.fuera = fuera ? "1" : "0";
    b.setAttribute("aria-current", e.n === S.etapa ? "true" : "false");
    b.innerHTML = `<span class="dot">${es === "cerrado" && !fuera ? "✓" : e.n}</span>
      <b>${esc(e.nombre)}</b>
      <em>${reglasDe(e).length} reglas${e.ok ? ' · <span class="ok">OK usuario</span>' : ""}</em>`;
    b.onclick = () => { S.etapa = e.n; S.tipo = null; guardar(); pintar(); };
    c.appendChild(b);
  });

  document.getElementById("railfoot").innerHTML = "";
  const s = document.createElement("small");
  s.innerHTML = `Etapas y gates transcritos de<br><span class="mono">ai-production-director §3</span>`;
  const th = document.createElement("button");
  th.className = "chip"; th.textContent = "Tema";
  th.onclick = () => { const r = document.documentElement;
    const osc = r.dataset.theme ? r.dataset.theme === "dark"
      : matchMedia("(prefers-color-scheme: dark)").matches;
    r.dataset.theme = osc ? "light" : "dark"; };
  document.getElementById("railfoot").append(s, th);
}

function pintar(){
  riel();
  const e = ET.find(x => x.n === S.etapa), es = S.estado[e.n] || "pendiente";
  const fuera = !enTrack(e);
  const todas = reglasDe(e, S.tipo);
  const q = S.q.toLowerCase();
  const vis = todas.filter(r => (!S.origen || r.o === S.origen) &&
    (!q || r.t.toLowerCase().includes(q) || r.s.toLowerCase().includes(q)));
  const porArch = {};
  vis.forEach(r => (porArch[r.s + "/" + r.a] ||= []).push(r));
  const orden = Object.keys(porArch).sort((a, b) => porArch[b].length - porArch[a].length);
  const cnt = o => todas.filter(r => r.o === o).length;

  document.getElementById("pane").innerHTML = `
  <header class="head">
    <div>
      <div class="eyebrow">Etapa ${e.n} · track ${S.track}</div>
      <h2>${esc(e.nombre)}</h2>
      ${e.cond ? `<p class="cond">${esc(e.cond)}</p>` : ""}
      <div class="tags">${e.skills.map(s => `<span class="tag">${esc(s)}</span>`).join("")}
        ${e.ok ? '<span class="tag" style="border-color:var(--amber);color:var(--amber)">OK explícito del usuario</span>' : ""}</div>
    </div>
    <div class="estados">${["pendiente","curso","cerrado"].map(k =>
      `<button data-e="${k}" aria-pressed="${es === k}">${ETQ[k]}</button>`).join("")}</div>
  </header>

  ${fuera ? `<p class="fuera">Esta etapa no corre en el track <b>${S.track}</b>.
     ${esc(TR[S.track].nota)}</p>` : ""}

  <div class="flow">
    <div><h3>Entra</h3><p>${md(e.entra)}</p></div>
    <div><h3>Sale</h3><p>${md(e.sale)}</p></div>
  </div>
  <div class="gate"><h3>Gate — se verifica ANTES de avanzar</h3><p>${md(e.gate)}</p></div>
  ${e.nota ? `<p class="nota-etapa">${esc(e.nota)}</p>` : ""}

  ${e.tipos ? `<div class="tipos"><span>Tipo de pieza</span>
    <button class="chip" data-t="" aria-pressed="${!S.tipo}">Todos ${reglasDe(e).length}</button>
    ${e.tipos.map(t => `<button class="chip" data-t="${t}" aria-pressed="${S.tipo === t}"
      title="${esc(CASOS[t] || t)}">${t} ${(PORCASO[t] || []).length}</button>`).join("")}</div>` : ""}

  <div class="bar">
    <h3>Reglas aplicables</h3><span class="count">${vis.length} de ${todas.length}</span>
    <div class="filtros">
      <input type="search" id="q" placeholder="Buscar…" value="${esc(S.q)}">
      ${["regla","auditoria","archivo"].map(o => `<button class="chip" data-o="${o}"
        aria-pressed="${S.origen === o}"><i class="k k-${o}"></i>${o} ${cnt(o)}</button>`).join("")}
    </div>
  </div>

  ${orden.length ? orden.map(k => `<section class="grupo">
    <h4><span>${esc(k)}</span><span>${porArch[k].length}</span></h4>
    ${porArch[k].map(r => `<article class="regla"><i class="k k-${r.o}"></i>
      <p>${md(r.t)}</p><span class="src">:${r.l}</span></article>`).join("")}
    </section>`).join("") : `<p class="vacio">Ninguna regla coincide con el filtro.</p>`}

  <p class="nota"><strong>El color de cada regla dice de dónde salió su clasificación.</strong>
  Pizarra es clasificada una por una · verde fue corregida por auditoría externa y manda sobre
  las otras dos · ámbar es clasificación gruesa por archivo, revísala antes de confiar en ella.</p>`;

  const p = document.getElementById("pane");
  p.querySelectorAll(".estados button").forEach(b => b.onclick = () => {
    S.estado[e.n] = b.dataset.e; guardar(); pintar(); });
  p.querySelectorAll(".chip[data-t]").forEach(b => b.onclick = () => {
    S.tipo = b.dataset.t || null; guardar(); pintar(); });
  p.querySelectorAll(".chip[data-o]").forEach(b => b.onclick = () => {
    S.origen = S.origen === b.dataset.o ? null : b.dataset.o; guardar(); pintar(); });
  const qi = document.getElementById("q");
  qi.oninput = () => { S.q = qi.value; pintar();
    const n = document.getElementById("q"); n.focus();
    n.setSelectionRange(n.value.length, n.value.length); };
}
pintar();
</script>
