<title>Sala de Producción</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#F5F4F1; --surface:#FFFFFF; --sunk:#EDEBE6; --line:#DAD6CE;
  --ink:#1B2026; --muted:#68707C; --faint:#98A0AB;
  --amber:#A9661F; --teal:#2A7168; --rust:#A6412F; --slate:#47535F;
  --amber-bg:#FAEFE0; --teal-bg:#E2EEEC; --rust-bg:#FAE7E3;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#12161C; --surface:#1A1F27; --sunk:#0D1116; --line:#2A313B;
  --ink:#E4E8ED; --muted:#8A94A3; --faint:#5C6673;
  --amber:#E0A44C; --teal:#4FA69B; --rust:#C4614D; --slate:#939FAD;
  --amber-bg:#2A2119; --teal-bg:#16292A; --rust-bg:#2A1B18;
}}
:root[data-theme="dark"]{
  --ground:#12161C; --surface:#1A1F27; --sunk:#0D1116; --line:#2A313B;
  --ink:#E4E8ED; --muted:#8A94A3; --faint:#5C6673;
  --amber:#E0A44C; --teal:#4FA69B; --rust:#C4614D; --slate:#939FAD;
  --amber-bg:#2A2119; --teal-bg:#16292A; --rust-bg:#2A1B18;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font:400 15px/1.55 Barlow,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:600;
  letter-spacing:.01em;text-wrap:balance;margin:0}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wrap{display:grid;grid-template-columns:312px minmax(0,1fr);min-height:100vh}
@media(max-width:880px){.wrap{grid-template-columns:1fr}}

.rail{background:var(--sunk);border-right:1px solid var(--line);
  padding:20px 0 24px;display:flex;flex-direction:column}
.brand{padding:0 18px 14px;border-bottom:1px solid var(--line)}
.brand h1{font-size:20px;letter-spacing:.03em;text-transform:uppercase}
.brand p{margin:3px 0 0;font-size:11.5px;color:var(--faint);
  font-family:"JetBrains Mono",monospace;letter-spacing:.03em}
.tracks{display:flex;gap:4px;padding:13px 18px;border-bottom:1px solid var(--line)}
.tracks button{flex:1;font-family:"JetBrains Mono",monospace;font-size:10.5px;
  letter-spacing:.06em;padding:6px 4px;border:1px solid var(--line);border-radius:3px;
  color:var(--muted);background:var(--surface)}
.tracks button[aria-pressed="true"]{border-color:var(--amber);color:var(--amber);background:var(--amber-bg)}
.trackinfo{padding:10px 18px 13px;border-bottom:1px solid var(--line);font-size:12.5px;
  color:var(--muted);line-height:1.45}
.etapas{padding:8px 0;flex:1}
.stage{display:grid;grid-template-columns:34px minmax(0,1fr);gap:1px 2px;
  padding:8px 16px 8px 12px;text-align:left;width:100%;position:relative;transition:background .12s}
.stage:hover{background:color-mix(in srgb,var(--line) 45%,transparent)}
.stage[aria-current="true"]{background:var(--surface);box-shadow:inset 3px 0 0 var(--amber)}
.stage[data-fuera="1"]{opacity:.38}
.dot{grid-row:1/3;justify-self:center;margin-top:2px;width:22px;height:22px;border-radius:50%;
  display:grid;place-items:center;font-size:11px;border:1.5px solid var(--line);
  background:var(--surface);color:var(--faint);position:relative;z-index:1;
  font-family:"JetBrains Mono",monospace}
.stage:not(:last-child) .dot::after{content:"";position:absolute;top:100%;left:50%;width:1.5px;
  height:24px;background:var(--line);transform:translateX(-50%)}
.stage[data-estado="curso"] .dot{border-color:var(--amber);color:var(--amber)}
.stage[data-estado="cerrado"] .dot{border-color:var(--teal);background:var(--teal);color:var(--ground)}
.stage b{font-family:"Barlow Condensed",sans-serif;font-size:16px;line-height:1.2}
.stage[data-estado="cerrado"] b{color:var(--muted)}
.stage em{font-style:normal;font-size:10.5px;letter-spacing:.05em;color:var(--faint);
  font-family:"JetBrains Mono",monospace}
.stage .ok{color:var(--amber)}
.railfoot{padding:14px 18px 0;border-top:1px solid var(--line);display:flex;
  justify-content:space-between;align-items:flex-end;gap:10px}
.railfoot small{font-size:11px;color:var(--faint);line-height:1.45}

.pane{padding:28px 34px 60px;max-width:1150px}
@media(max-width:880px){.pane{padding:22px 18px 48px}}
.head{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:flex-start;
  padding-bottom:16px;border-bottom:1px solid var(--line)}
.head h2{font-size:32px;line-height:1.08}
.eyebrow{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--amber);margin-bottom:4px}
.cond{font-size:13px;color:var(--muted);font-style:italic;margin-top:5px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.tag{font-family:"JetBrains Mono",monospace;font-size:11px;padding:3px 8px;
  border:1px solid var(--line);border-radius:3px;color:var(--slate);background:var(--surface)}
.estados{display:flex;gap:4px;margin-left:auto}
.estados button{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.05em;
  text-transform:uppercase;padding:6px 10px;border-radius:3px;border:1px solid var(--line);
  color:var(--muted);background:var(--surface)}
.estados button[aria-pressed="true"]{border-color:var(--amber);color:var(--amber);background:var(--amber-bg)}

.fuera{margin-top:18px;padding:11px 15px;border:1px dashed var(--line);border-radius:4px;
  font-size:13.5px;color:var(--muted)}
.flow{display:grid;grid-template-columns:1fr 1fr;margin-top:18px;border:1px solid var(--line);
  border-radius:4px;overflow:hidden;background:var(--surface)}
@media(max-width:700px){.flow{grid-template-columns:1fr}}
.flow div{padding:12px 16px}
.flow div+div{border-left:1px solid var(--line)}
@media(max-width:700px){.flow div+div{border-left:none;border-top:1px solid var(--line)}}
.flow h3,.gate h3{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  font-family:"JetBrains Mono",monospace;font-weight:500;margin-bottom:5px}
.flow h3{color:var(--faint)}
.flow p,.gate p{margin:0;font-size:14.5px}
.gate{margin-top:12px;border-left:3px solid var(--rust);background:var(--rust-bg);
  padding:12px 16px;border-radius:0 4px 4px 0}
.gate h3{color:var(--rust)}
.nota-etapa{margin-top:10px;font-size:13.5px;color:var(--muted);padding-left:16px;
  border-left:2px solid var(--line)}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin:28px 0 10px}
.bar h3{font-size:19px}
.count{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--muted)}
.filtros{display:flex;gap:5px;flex-wrap:wrap;margin-left:auto}
.chip{font-family:"JetBrains Mono",monospace;font-size:10.5px;padding:4px 9px;
  border:1px solid var(--line);border-radius:3px;color:var(--muted);background:var(--surface)}
.chip[aria-pressed="true"]{color:var(--ink);border-color:var(--slate);background:var(--sunk)}
.k{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:1px}
.k-regla{background:var(--slate)}.k-auditoria{background:var(--teal)}.k-archivo{background:var(--amber)}
input[type=search]{font:inherit;font-size:13px;padding:6px 10px;min-width:180px;
  border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink)}
.tipos{display:flex;gap:5px;flex-wrap:wrap;margin:16px 0 0;padding:11px 14px;
  background:var(--sunk);border:1px solid var(--line);border-radius:4px;align-items:center}
.tipos > span{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--faint);margin-right:4px}

.grupo{margin-top:18px}
.grupo>h4{font-family:"JetBrains Mono",monospace;font-size:11.5px;font-weight:500;
  letter-spacing:.04em;color:var(--faint);padding-bottom:5px;border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;gap:12px}
.regla{display:grid;grid-template-columns:5px minmax(0,1fr) auto;gap:0 12px;align-items:start;
  padding:9px 0;border-bottom:1px solid var(--line)}
.regla .k{border-radius:2px;align-self:stretch;min-height:16px;width:5px;height:auto;margin:0}
.regla p{margin:0;font-size:14.5px;line-height:1.5}
.regla b,.gate b,.flow b{font-weight:600}
code{font-family:"JetBrains Mono",monospace;font-size:.88em;background:var(--sunk);padding:1px 4px;border-radius:2px;color:var(--slate)}
.regla .src{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--faint);
  white-space:nowrap;padding-top:2px}
.vacio{padding:26px 0;color:var(--muted)}
.nota{margin-top:32px;padding-top:15px;border-top:1px solid var(--line);font-size:13px;
  color:var(--muted);max-width:68ch}
.nota strong{color:var(--ink);font-weight:600}
</style>

director","a":"SKILL.md","l":19,"t":"**Resolver conflictos** entre sub-skills con las reglas de la sección 6 — las decidiste una vez, no se renegocian por proyecto.","o":"regla"},"2c2da899a44d":{"s":"ai-production-director","a":"SKILL.md","l":20,"t":"**Mantener trazabilidad**: todo artefacto downstream traza a un shot ID, todo shot traza a una escena, toda escena al concepto aprobado.","o":"regla"},"4ca2dc8c76f1":{"s":"ai-production-director","a":"SKILL.md","l":65,"t":"Cada etapa declara: sub-skill, entradas, salidas, y gate. El gate se verifica ANTES de avanzar. Si falla, se corrige en la etapa actual — nunca se \"arregla después\".","o":"regla"},"36dd5696e226":{"s":"ai-production-director","a":"SKILL.md","l":75,"t":"**Gate:** el usuario selecciona UN concepto. No se escribe una línea de guion con concepto abierto.","o":"regla"},"043b9dc0b02e":{"s":"ai-production-director","a":"SKILL.md","l":85,"t":"**Gate:** cero palabras del vocabulario prohibido (sección 6.1). Cada decisión de cámara tiene razón dramática escrita.","o":"regla"},"3fb8782f57b8":{"s":"ai-production-director","a":"SKILL.md","l":101,"t":"**Gate obligatorio:** los dos checks de `video` (dramaturgy check de 6 puntos + auditoría de 3 detalles) Y, si `aurora-prompt-linter` está instalada, el linter pasa limpio. Un prompt que falla cualquiera de los dos NO se entrega.","o":"regla"},"5673820bc473":{"s":"ai-production-director","a":"SKILL.md","l":112,"t":"Nunca preguntes lo que el brief o los artefactos previos ya responden.","o":"regla"},"f556f97c9939":{"s":"ai-production-director","a":"SKILL.md","l":123,"t":"El vocabulario prohibido de `video`/dramaturgy (+ `aurora-prompt-linter` si está) **gana siempre**: \"cinematic\", \"epic\", \"stunning\", \"masterpiece\", \"beautiful lighting\", \"professional\", \"high quality\", emociones nombradas sin cuerpo. Esto **anula explícitamente** la regla de `ai-video-storyboard` de cerrar cada prompt con \"cinematic 1080p, synchronized audio\". En su lugar: la resolución, aspect ra","o":"regla"},"4c5ba2b2ce9e":{"s":"ai-production-director","a":"SKILL.md","l":129,"t":"De la Etapa 4 en adelante: `shots.json`. Un cambio creativo se hace primero en shots.json y se propaga hacia abajo; nunca se parcha un prompt de forma que contradiga su shot.","o":"regla"},"1cf2b2af3609":{"s":"ai-production-director","a":"SKILL.md","l":132,"t":"`visual-prompt-forge` es dueño del **flujo de datos** (shots.json → borrador, critique.json → revisión selectiva). `video`/`image` smixs son dueños del **texto final** del prompt. El borrador del forge se reescribe a sintaxis smixs; nunca al revés.","o":"regla"},"b2a93a3b39b9":{"s":"ai-production-director","a":"SKILL.md","l":141,"t":"**Proyectos de animación** (2D/3D/motion graphics): es la única skill instalada con los 12 principios de Disney y el flujo de producción de animación. En un proyecto animado, su sección de animación se suma a la Etapa 3 como referencia de performance y timing.","o":"regla"},"201666abd399":{"s":"ai-production-director","a":"SKILL.md","l":150,"t":"`references/creative-strategy.md` — Protocolo completo de la Etapa 1: territorios, big ideas, concept cards, matriz de selección, dirección narrativa. Léelo SIEMPRE al ejecutar la Etapa 1.","o":"regla"},"0574ba956e73":{"s":"ai-production-director","a":"SKILL.md","l":151,"t":"`references/production-package.md` — Spec del Final AI Video Production Package, reglas de trazabilidad y checklist maestro. Léelo SIEMPRE al ejecutar la Etapa 7.","o":"regla"},"476511682f20":{"s":"ai-production-director","a":"references/creative-strategy.md","l":17,"t":"Si el single-minded proposition no se puede escribir en una frase, la Etapa 1 no puede continuar. Resuélvelo con el usuario primero.","o":"regla"},"240748ade236":{"s":"ai-production-director","a":"references/creative-strategy.md","l":37,"t":"De los territorios más fuertes, baja 3–5 conceptos (FILM) o 2–3 (STANDARD). Cada concepto es UNA película posible, no una variación de la anterior. Formato obligatorio:","o":"regla"},"eee77c7d576a":{"s":"ai-production-director","a":"references/production-package.md","l":44,"t":"Todo prompt (imagen o video) lleva en comentario su `shot_id`.","o":"regla"},"f999ef3808aa":{"s":"ai-production-director","a":"references/production-package.md","l":45,"t":"Todo shot en shots.json referencia su escena del script (`scene` field o nota).","o":"regla"},"8c97f2430a2a":{"s":"ai-production-director","a":"references/production-package.md","l":46,"t":"El script referencia la concept card ganadora en su encabezado.","o":"regla"},"ed8f12484923":{"s":"ai-production-director","a":"references/production-package.md","l":47,"t":"Cambios: si un prompt necesita cambiar algo que su shot fija (encuadre, acción, luz), el cambio se hace en shots.json y se regenera hacia abajo. El paquete nunca contiene un prompt que contradiga su shot.","o":"regla"},"69545d03256e":{"s":"ai-production-director","a":"references/production-package.md","l":48,"t":"Verificación de cierre: muestrea 3 prompts al azar y traza la cadena prompt → shot → escena → concepto. Si un eslabón falta, el paquete no se entrega.","o":"regla"},"9848dbda5e26":{"s":"ai-production-director","a":"references/production-package.md","l":70,"t":"[ ] Dirección cinematográfica sin vocabulario prohibido","o":"regla"},"eb02f32299e5":{"s":"ai-video-storyboard","a":"SKILL.md","l":12,"t":"**Core insight:** Visual consistency across shots matters more than any single shot being perfect. A mediocre but consistent set of shots edits together; six gorgeous but mismatched shots do not.","o":"archivo"},"fe59b8611a5b":{"s":"ai-video-storyboard","a":"SKILL.md","l":32,"t":"**Goal platform and duration?** (TikTok 30s / Reel 15-60s / YouTube Short / Instagram Ad / explainer)","o":"archivo"},"4a161f379427":{"s":"ai-video-storyboard","a":"SKILL.md","l":33,"t":"**What is the video about?** (subject, story, product)","o":"archivo"},"53a3fb486be4":{"s":"ai-video-storyboard","a":"SKILL.md","l":34,"t":"**Brand vibe / tone?** (cozy, energetic, premium, minimalist, playful, cinematic, etc.)","o":"archivo"},"0a4395028757":{"s":"ai-video-storyboard","a":"SKILL.md","l":35,"t":"**Call to action at the end?** (visit website, buy product, follow channel, etc.)","o":"archivo"},"375413fbe1a3":{"s":"ai-video-storyboard","a":"SKILL.md","l":36,"t":"**Any hard constraints?** (must include logo, specific colors, locations, etc.)","o":"archivo"},"658b20f679d9":{"s":"ai-video-storyboard","a":"SKILL.md","l":62,"t":"**Lens character** (shallow DOF / deep focus / wide angle distortion / macro)","o":"archivo"},"ce8831e8984c":{"s":"ai-video-storyboard","a":"SKILL.md","l":66,"t":"Write these as a **Visual Theme** block at the top of the output. Every shot's prompt must respect this block.","o":"archivo"},"68f234798bd5":{"s":"ai-video-storyboard","a":"SKILL.md","l":89,"t":"**Always specify the shared visual language** in every prompt (color palette, lighting, lens character, film look). This is how you enforce consistency.","o":"archivo"},"87680002b885":{"s":"ai-video-storyboard","a":"SKILL.md","l":90,"t":"**Specify exact duration** (4s / 5s / 8s) and **aspect ratio** (9:16 for TikTok/Reels, 16:9 for YouTube landscape, 1:1 for feed posts).","o":"archivo"},"097929817bc7":{"s":"ai-video-storyboard","a":"SKILL.md","l":91,"t":"**Always end with \"cinematic 1080p, synchronized audio\"** — this signals professional-grade quality and works with modern video models that support both.","o":"archivo"},"79369bcf16d4":{"s":"ai-video-storyboard","a":"SKILL.md","l":92,"t":"**Use cinematography vocabulary**: ECU (extreme close-up), CU, MS (medium shot), WS (wide shot), OTS (over-the-shoulder), POV, Dutch angle, low angle, high angle, bird's eye, dolly in, dolly out, tracking, handheld, rack focus, etc.","o":"archivo"},"3dde58c707c6":{"s":"ai-video-storyboard","a":"SKILL.md","l":93,"t":"**Don't write abstract prompts** — be concrete. \"A woman\" → \"A barista in her late 20s with wavy auburn hair, wearing a denim apron\".","o":"archivo"},"60f13533c38e":{"s":"ai-video-storyboard","a":"SKILL.md","l":94,"t":"**No model-specific hacks** — don't write prompts tuned to specific model quirks. Write model-agnostic cinematic prompts that work anywhere.","o":"archivo"},"c04789da6e17":{"s":"ai-video-storyboard","a":"SKILL.md","l":98,"t":"The sequence of shots must have a **story arc**, not a random list. Use one of these patterns:","o":"archivo"},"f136c00c3d59":{"s":"ai-video-storyboard","a":"SKILL.md","l":146,"t":"**Header** — Title, duration, shot count, aspect ratio","o":"archivo"},"f44cf9ff7226":{"s":"ai-video-storyboard","a":"SKILL.md","l":147,"t":"**Visual Theme** — Shared palette, lighting, lens, film look, motion","o":"archivo"},"5598ee94689f":{"s":"ai-video-storyboard","a":"SKILL.md","l":148,"t":"**Shot List** — N shots, each following the structure in Step 4","o":"archivo"},"ab3cc98cbe7f":{"s":"ai-video-storyboard","a":"SKILL.md","l":150,"t":"**Why This Works** — creative rationale","o":"archivo"},"ebc1422e5d22":{"s":"brand-lock-extractor","a":"SKILL.md","l":12,"t":"This skill extracts. It does not invent. Every value is sampled from a real asset or flagged as an estimate the user must confirm. A confident-sounding wrong hex is worse than a flagged guess.","o":"archivo"},"fcc9a56efa31":{"s":"brand-lock-extractor","a":"SKILL.md","l":34,"t":"Written description | Use directly | Identity, archetype, voice posture","o":"archivo"},"96e709999be1":{"s":"brand-lock-extractor","a":"SKILL.md","l":46,"t":"Tell the user what you are pulling. Do not ask follow-ups yet, extract first, confirm gaps at the end.","o":"archivo"},"5fe217339055":{"s":"brand-lock-extractor","a":"SKILL.md","l":52,"t":"**Identity** (brand, one-line description, archetype, voice posture)","o":"archivo"},"0dae3fdc0ace":{"s":"brand-lock-extractor","a":"SKILL.md","l":53,"t":"**Palette** (sampled hex, by role)","o":"archivo"},"39e68cb30388":{"s":"brand-lock-extractor","a":"SKILL.md","l":54,"t":"**Typography** (display, body, optional mono, with weights)","o":"archivo"},"c183542f6090":{"s":"brand-lock-extractor","a":"SKILL.md","l":55,"t":"**Mood adjectives** (3-5, specific, contrast clauses preferred)","o":"archivo"},"6257a4f1fd42":{"s":"brand-lock-extractor","a":"SKILL.md","l":56,"t":"**Never list** (what the brand avoids, inferred from consistency)","o":"archivo"},"89c96fc0932b":{"s":"brand-lock-extractor","a":"SKILL.md","l":57,"t":"**Aspect ratios**","o":"archivo"},"ddd43db015c9":{"s":"brand-lock-extractor","a":"SKILL.md","l":58,"t":"**Color grade direction** (one sentence)","o":"archivo"},"4075284680a4":{"s":"brand-lock-extractor","a":"SKILL.md","l":59,"t":"**Motion language** (one paragraph)","o":"archivo"},"086086b8d7f3":{"s":"brand-lock-extractor","a":"SKILL.md","l":60,"t":"**Voice rules** (copy-level constraints)","o":"archivo"},"c9c3a9312a4c":{"s":"brand-lock-extractor","a":"SKILL.md","l":69,"t":"**inferred**, reasoned from evidence but not stated (archetype from positioning, never-list from consistency). Reasonable to ship, worth noting.","o":"archivo"},"cd4c7a7c3646":{"s":"brand-lock-extractor","a":"SKILL.md","l":74,"t":"Use `templates/brand-lock.md.tpl`. Fill **every** required section, no placeholders left behind. Then append an `## Extraction notes` section that lists every `inferred` and `needs confirmation` value with its source and your reasoning. This section is the audit trail; it does not break validation (the validator checks the nine required sections are present, extra sections are fine).","o":"archivo"},"49fd83a4b509":{"s":"brand-lock-extractor","a":"SKILL.md","l":82,"t":"All nine required sections present: Identity, Palette, Typography, Mood adjectives, Never list, Aspect ratios, Color grade direction, Motion language, Voice rules.","o":"archivo"},"afdb75007c72":{"s":"brand-lock-extractor","a":"SKILL.md","l":94,"t":"Colors are sampled, never guessed. Read them from a brand book, from CSS, or by sampling pixels in a screenshot. If you genuinely cannot determine a color, fill your closest estimate and mark it `needs confirmation` in Extraction notes. \"Navy\" is not a palette entry. `#0F1F3A` is. A wrong hex stated confidently corrupts every downstream prompt.","o":"archivo"},"6eb4f8ba4dbc":{"s":"brand-lock-extractor","a":"SKILL.md","l":98,"t":"Identify fonts from the brand book, the site's CSS/font files, or clear visual match. If you cannot identify one, say so and flag it, do not name a plausible-sounding font you did not verify.","o":"archivo"},"03ede5f175d7":{"s":"brand-lock-extractor","a":"SKILL.md","l":106,"t":"It is also the hardest to extract, because brands document what they do, not what they avoid. Infer it from consistency: if every image avoids stock-photo gloss, that is a never. If copy never uses exclamation points, that is a never. Read `references/extraction-rubric.md` for the method. Do not ship an empty never-list.","o":"archivo"},"3d50d9dc8cee":{"s":"brand-lock-extractor","a":"brand-packs/examples/saas-clean.md","l":40,"t":"never use stock photo aesthetic","o":"archivo"},"2b77fe0ab77d":{"s":"brand-lock-extractor","a":"brand-packs/examples/saas-clean.md","l":41,"t":"never use AI uncanny faces","o":"archivo"},"528f3aca58d3":{"s":"brand-lock-extractor","a":"brand-packs/examples/saas-clean.md","l":42,"t":"never use illustrations of people (real photography or abstract data viz only)","o":"archivo"},"34f304b45ae2":{"s":"brand-lock-extractor","a":"brand-packs/examples/saas-clean.md","l":43,"t":"never use gradients (flat color only)","o":"archivo"},"70f50258fc9f":{"s":"brand-lock-extractor","a":"brand-packs/examples/saas-clean.md","l":44,"t":"never use rounded corners larger than 8px","o":"archivo"},"a61acb519eac":{"s":"brand-lock-extractor","a":"brand-packs/examples/saas-clean.md","l":45,"t":"never use exclamation points","o":"archivo"},"39f21f0bd621":{"s":"brand-lock-extractor","a":"brand-packs/examples/saas-clean.md","l":46,"t":"never use vague claims (\"the best\", \"industry-leading\", \"cutting-edge\")","o":"archivo"},"bdeeca395947":{"s":"brand-lock-extractor","a":"brand-packs/examples/saas-clean.md","l":47,"t":"never use AI/ML buzzwords without specifics","o":"archivo"},"21f3127a222e":{"s":"brand-lock-extractor","a":"brand-packs/examples/saas-clean.md","l":48,"t":"never default to dark mode in primary marketing","o":"archivo"},"289646ec1639":{"s":"brand-lock-extractor","a":"brand-packs/examples/saas-clean.md","l":49,"t":"never use animated icons or lottie illustrations","o":"archivo"},"5108ce119398":{"s":"brand-lock-extractor","a":"brand-packs/examples/saas-clean.md","l":70,"t":"prefer specific numbers (\"40% reduction in 90 days\" not \"significant improvement\")","o":"archivo"},"98944bc5d597":{"s":"brand-lock-extractor","a":"brand-packs/examples/saas-clean.md","l":71,"t":"prefer \"we\" and \"you\" over \"the company\" and \"the user\"","o":"archivo"},"5e5cfb4ec221":{"s":"brand-lock-extractor","a":"brand-packs/examples/saas-clean.md","l":72,"t":"prefer present-tense","o":"archivo"},"cc15db8a3ce1":{"s":"brand-lock-extractor","a":"brand-packs/examples/saas-clean.md","l":73,"t":"never start a sentence with \"Just\" or \"Simply\"","o":"archivo"},"f861a19be4ca":{"s":"brand-lock-extractor","a":"brand-packs/examples/saas-clean.md","l":74,"t":"avoid corporate hedge language (\"seek to\", \"look to\", \"aim to\")","o":"archivo"},"42b960dda0f5":{"s":"brand-lock-extractor","a":"examples/brand-lock.md","l":36,"t":"never use stock smiles or posed lifestyle photography","o":"archivo"},"e320951a2f69":{"s":"brand-lock-extractor","a":"examples/brand-lock.md","l":37,"t":"never use latte art as decoration","o":"archivo"},"deff6acf6ba6":{"s":"brand-lock-extractor","a":"examples/brand-lock.md","l":38,"t":"never use the word \"artisanal\"","o":"archivo"},"995266039bd6":{"s":"brand-lock-extractor","a":"examples/brand-lock.md","l":39,"t":"never use exclamation points","o":"archivo"},"9c0afb7d325a":{"s":"brand-lock-extractor","a":"examples/brand-lock.md","l":40,"t":"never shoot glossy product-on-white; matte and natural-light only","o":"archivo"},"00c5d773e8d3":{"s":"brand-lock-extractor","a":"examples/brand-lock.md","l":41,"t":"never lean on burnt, dark-roast cliche imagery","o":"archivo"},"a9ed618bb40b":{"s":"brand-lock-extractor","a":"examples/brand-lock.md","l":49,"t":"> Matte, low contrast, natural window light, warm but restrained. Reminiscent of Kinfolk editorial photography. Never glossy commercial product lighting.","o":"archivo"},"2d715d9073e7":{"s":"brand-lock-extractor","a":"examples/brand-lock.md","l":58,"t":"never the word \"artisanal\" (or \"curated\", \"elevated\")","o":"archivo"},"b5797c1841f0":{"s":"brand-lock-extractor","a":"examples/brand-lock.md","l":59,"t":"short declarative sentences; cut adjectives before nouns that do not need them","o":"archivo"},"fb243b53c635":{"s":"brand-lock-extractor","a":"examples/brand-lock.md","l":60,"t":"prefer specific origin claims (farm, region, roast date) over vague quality words","o":"archivo"},"daf6cf4dbcb9":{"s":"brand-lock-extractor","a":"references/extraction-rubric.md","l":10,"t":"**inferred**, reasoned from evidence, not stated. Archetype from how the brand frames problems. Never-list from what the assets consistently avoid. Ship it, note the reasoning.","o":"archivo"},"d446778cd38a":{"s":"brand-lock-extractor","a":"references/extraction-rubric.md","l":17,"t":"**One-line description:** what the brand does and who for. This is the load-bearing sentence; a generator implicitly references it on every prompt. Pull it from the hero headline plus the about page. Prefer concrete over abstract: \"Managed bookkeeping for solo law firms\" beats \"Financial services for professionals.\" If the site only offers a vague tagline, sharpen it from the services/about copy a","o":"archivo"},"b4fbf43a4a92":{"s":"brand-lock-extractor","a":"references/extraction-rubric.md","l":19,"t":"**Archetype:** one word, Operator, Sage, Caregiver, Rebel, Creator, Jester, Ruler, Everyman, etc. Almost always `inferred`. Read it from how the brand frames the customer's problem:","o":"archivo"},"04363c882bf7":{"s":"brand-lock-extractor","a":"references/extraction-rubric.md","l":36,"t":"**Never guess a hex.** If you cannot read or sample one, estimate, label it `needs confirmation`, and tell the user exactly which role to verify. (See SKILL.md Rule 1.)","o":"archivo"},"a69c36bdec51":{"s":"brand-lock-extractor","a":"references/extraction-rubric.md","l":44,"t":"**Screenshots:** identify by eye only if confident; otherwise flag `needs confirmation`. Do not invent a plausible name (Rule 2).","o":"archivo"},"a1ad2f291171":{"s":"brand-lock-extractor","a":"references/extraction-rubric.md","l":50,"t":"3-5 adjectives, specific, contrast clauses preferred. Read tone from the body copy and the imagery together.","o":"archivo"},"775e72423ee9":{"s":"brand-lock-extractor","a":"references/extraction-rubric.md","l":56,"t":"The hardest and most valuable section. Brands document what they do; you infer what they avoid from consistency across the assets.","o":"archivo"},"3f18cfa9b5e8":{"s":"brand-lock-extractor","a":"references/extraction-rubric.md","l":59,"t":"Imagery: no stock-photo gloss? no people? no gradients? no clip-art icons? Each absence is a never.","o":"archivo"},"a86e2eb18131":{"s":"brand-lock-extractor","a":"references/extraction-rubric.md","l":60,"t":"Copy: no exclamation points? no hype words (\"revolutionary\", \"game-changing\")? no emojis? no questions in headlines? Each pattern is a never.","o":"archivo"},"451be222e3f4":{"s":"brand-lock-extractor","a":"references/extraction-rubric.md","l":61,"t":"Color/layout: never full-bleed photography? never more than one accent? never centered body text?","o":"archivo"},"f419380942de":{"s":"brand-lock-extractor","a":"references/extraction-rubric.md","l":63,"t":"Turn each observed constraint into a `never` line. Be specific: \"never use stock-photo aesthetic\" beats \"keep it authentic\". Aim for 5+. Never ship an empty list (Rule 4).","o":"archivo"},"dd519aa232b4":{"s":"brand-lock-extractor","a":"references/extraction-rubric.md","l":71,"t":"One sentence on how footage and generated images should be graded, with a reference point where possible (Kodak Portra 400, Apple keynote photography, A24 film grade). Infer from the existing photography's warmth, contrast, and saturation. If there is no photography to read, base it on the palette and flag `needs confirmation`.","o":"archivo"},"5a0a397f54c1":{"s":"brand-lock-extractor","a":"references/extraction-rubric.md","l":75,"t":"One paragraph: camera moves, cut style, text animation, pacing. Read from any existing video or motion on the site; if there is none, infer a conservative default consistent with the voice posture (a Quiet/Authoritative brand -> minimal, slow, deliberate) and flag `needs confirmation`. Keep it to one coherent motion language, do not blend \"minimal and deliberate\" with \"energetic whip pans\".","o":"archivo"},"f3fad8754516":{"s":"brand-lock-extractor","a":"references/extraction-rubric.md","l":79,"t":"Copy-level constraints for VO and on-screen text. Many overlap the never-list but are phrased as authoring rules: \"no em dashes\", \"sentences under 14 words\", \"prefer specific numbers over vague claims\", \"no exclamation points in headlines\". Extract from observed copy patterns. These become prompt constraints downstream, so make them enforceable, not aspirational.","o":"archivo"},"11ea00e863de":{"s":"image","a":"SKILL.md","l":18,"t":"The body of this SKILL.md is intentionally thin so you cannot fake a result by reading it alone. The actual rules — what the models reward, what they punish, how to phrase a 5-slot template, when to add `quality: high`, when to use image grounding — live only in the reference files.","o":"regla"},"3f921ee68519":{"s":"image","a":"SKILL.md","l":22,"t":"**Motion, clips, montage** (Seedance, Kling, Veo, any image-to-video): use the sibling `video` skill. This skill's storyboard and keyframe outputs feed it.","o":"regla"},"0358891ec685":{"s":"image","a":"SKILL.md","l":40,"t":"**Nano Banana** → [nano-banana.md](references/nano-banana.md) Image grounding for real locations. Extreme aspect ratios (1:8, 8:1, 4:1). Thinking mode. JSON for 5+ elements. Up to 14 reference images. Why you must NOT write `50mm / f-stop / ISO` numbers.","o":"regla"},"c5eb6fd7f6f8":{"s":"image","a":"SKILL.md","l":43,"t":"**GPT Image 2** → [gpt-image.md](references/gpt-image.md) 5-slot template (Scene / Subject / Important Details / Use Case / Constraints). Anti-slop banned-words list. `quality: low / medium / high` as a deliberate fidelity lever. Size constraints (multiples of 16, max 3:1, up to 2560×1440). Two-column edit logic (Change / Preserve / Constraints). Up to 16 reference images with explicit roles.","o":"regla"},"485206c1697b":{"s":"image","a":"SKILL.md","l":50,"t":"Universal rules that apply to both models: start with a verb, positive framing, hex colors, quote text, edit don't re-roll, one change per iteration, reference images.","o":"regla"},"67a7dd9329dc":{"s":"image","a":"SKILL.md","l":100,"t":"For edits, also include an explicit preserve-list (mandatory for gpt-image-2, recommended for nano-banana):","o":"regla"},"890a0b28f120":{"s":"image","a":"SKILL.md","l":112,"t":"Prefer: ready-to-copy prompts, hex colors, concrete materials, named compositions, model-specific syntax (5-slot for GPT Image, natural prose for Nano Banana).","o":"regla"},"0e7900ffe2af":{"s":"image","a":"SKILL.md","l":114,"t":"Avoid: tag soup (\"cool, modern, 4k\"), vague praise (\"stunning, epic, masterpiece\" — actively hurts GPT Image 2), negative framing (\"no people, no cars\" — invert to positive), external comparisons (\"like Apple ad\" — describe the visual properties instead), numerical lens parameters in Nano Banana prompts (it ignores them).","o":"regla"},"09ec7d23fe12":{"s":"image","a":"references/creative-direction.md","l":34,"t":"Hasselblad — medium format, shallow DOF, fashion/portrait","o":"regla"},"b921448eda9a":{"s":"image","a":"references/creative-direction.md","l":47,"t":"\"Waist-up portrait\", \"full body\", \"over-the-shoulder\"","o":"regla"},"b8fa85d560e3":{"s":"image","a":"references/creative-direction.md","l":50,"t":"\"Shallow depth of field\" — blurred background","o":"regla"},"5ad1340da288":{"s":"image","a":"references/creative-direction.md","l":56,"t":"> descriptive terms. Prefer \"shallow depth of field\" over \"f/1.8\".","o":"regla"},"862a4c0ea3bc":{"s":"image","a":"references/creative-direction.md","l":78,"t":"Define physical makeup of subjects. Don't just say the thing — describe what it's MADE of.","o":"regla"},"d9bcca3cf113":{"s":"image","a":"references/golden-rules.md","l":12,"t":"Describe what you WANT, not what you don't want. The model understands presence better than absence.","o":"regla"},"1dd54b582a02":{"s":"image","a":"references/golden-rules.md","l":14,"t":"✅ \"empty street\" → ❌ \"street with no cars\"","o":"regla"},"7fff008d0b4a":{"s":"image","a":"references/golden-rules.md","l":15,"t":"✅ \"clean background\" → ❌ \"no clutter\"","o":"regla"},"f5bdd52eae18":{"s":"image","a":"references/golden-rules.md","l":16,"t":"✅ \"solo portrait\" → ❌ \"no other people\"","o":"regla"},"cc4167f1d432":{"s":"image","a":"references/golden-rules.md","l":27,"t":"❌ Bad: \"Cool car, neon, city, night, 8k\"","o":"regla"},"8d02f99b51e9":{"s":"image","a":"references/golden-rules.md","l":28,"t":"✅ Good: \"A cinematic wide shot of a futuristic sports car speeding through a rainy Tokyo street at night. Neon signs reflect off wet pavement and metallic chassis.\"","o":"regla"},"8901152207fe":{"s":"image","a":"references/golden-rules.md","l":42,"t":"\"for Brazilian gourmet cookbook\" → infers professional plating, shallow DOF","o":"regla"},"04c28ccbddf9":{"s":"image","a":"references/golden-rules.md","l":158,"t":"**Используй как HIGH-LEVEL steering** — якорь задаёт настроение и эстетику, а не заменяет весь промпт","o":"regla"},"3db8f42e251f":{"s":"image","a":"references/golden-rules.md","l":159,"t":"**Комбинируй с конкретными визуальными деталями** — якорь устанавливает мир, детали устанавливают специфику","o":"regla"},"16ec02525ce7":{"s":"image","a":"references/golden-rules.md","l":160,"t":"**Не стакай несколько genre anchors** — выбери один. \"Peter Lindbergh + Wes Anderson\" = каша","o":"regla"},"47652229b5ab":{"s":"image","a":"references/golden-rules.md","l":161,"t":"**Era/cultural anchors работают лучше с GPT Image 2** (world knowledge). С Nano Banana результат менее предсказуем — NB больше опирается на явные описания","o":"regla"},"1848820351ae":{"s":"image","a":"references/gpt-image.md","l":39,"t":"мудовый язык, в котором тонут функциональные требования | прямое заявление: «image must contain a transit kiosk»","o":"regla"},"20e10fa23ffc":{"s":"image","a":"references/gpt-image.md","l":74,"t":"Маленький/плотный/multi-font → `quality: high` обязательно.","o":"regla"},"26e0c5fc6ab4":{"s":"image","a":"references/gpt-image.md","l":96,"t":"**Object removal:** «Remove [X]. Do not change anything else. Use `input_fidelity: high` to maintain surrounding context» (только gpt-image-1.5/1, в gpt-image-2 high-fidelity по умолчанию).","o":"regla"},"822ae545689f":{"s":"image","a":"references/gpt-image.md","l":117,"t":"GPT Image 2 умеет домысливать контекст: «Bethel, NY, August 1969» → выведет Woodstock-эстетику. Используй: дай исторический/культурный анкер, не расписывай каждую деталь.","o":"regla"},"c10c7e21ff29":{"s":"image","a":"references/models.md","l":34,"t":"**Структурированный 5-slot промпт.** Чёткое разделение Scene/Subject/Details/Use case/Constraints даёт предсказуемость.","o":"regla"},"c842524ed79f":{"s":"image","a":"references/multi-panel.md","l":13,"t":"**When to use:** TVC or commercial shot breakdown — one image = 9 panels with scene titles and timestamps.","o":"regla"},"a127cca4810d":{"s":"image","a":"references/multi-panel.md","l":46,"t":"**Recommended size:** 1536x1024 (landscape)","o":"regla"},"e01904554508":{"s":"image","a":"references/multi-panel.md","l":50,"t":"Vague scene descriptions produce near-identical panels — each must have a distinct action, angle, or subject","o":"regla"},"3d26f71cccce":{"s":"image","a":"references/multi-panel.md","l":57,"t":"**When to use:** Same person shown from 4 angles/crops in one image for an editorial or casting look.","o":"regla"},"52c7e13d4185":{"s":"image","a":"references/multi-panel.md","l":83,"t":"**Recommended size:** 1024x1024 (square) or 1024x1536 (vertical for portrait emphasis)","o":"regla"},"796a278bda86":{"s":"image","a":"references/multi-panel.md","l":94,"t":"**When to use:** Hero shot + close-up + action for a campaign visual — horizontal or vertical triptych.","o":"regla"},"3a5fb89a88b1":{"s":"image","a":"references/multi-panel.md","l":122,"t":"**Recommended size:** 1536x1024 (horizontal triptych) or 1024x1536 (vertical triptych)","o":"regla"},"7421490e82fa":{"s":"image","a":"references/multi-panel.md","l":123,"t":"**Model:** GPT Image 2 `quality: medium` — if text overlay needed, use `quality: high`","o":"regla"},"576f2ecf7dd2":{"s":"image","a":"references/multi-panel.md","l":133,"t":"**When to use:** 12 panels telling a story or showing moods — no gaps between panels, seamless mosaic feel.","o":"regla"},"5eca40f8b2dc":{"s":"image","a":"references/multi-panel.md","l":162,"t":"**Recommended size:** 1536x1024 (landscape) — gives each cell enough resolution","o":"regla"},"e25ece2ca897":{"s":"image","a":"references/multi-panel.md","l":173,"t":"**When to use:** Fashion editorial or film-style sequence — multiple camera angles of the same scene in one image.","o":"regla"},"0237812f9545":{"s":"image","a":"references/multi-panel.md","l":205,"t":"**Recommended size:** 1536x1024 (landscape, 3x2 grid)","o":"regla"},"79ad480edaab":{"s":"image","a":"references/multi-panel.md","l":209,"t":"Top-down and low-angle in the same grid confuse the model if you don't anchor each frame to a grid position","o":"regla"},"921aa8a23672":{"s":"image","a":"references/multi-panel.md","l":210,"t":"Motion blur instruction must be specific (\"blur on hands and feet\") or the model applies blur everywhere","o":"regla"},"d9727650ad44":{"s":"image","a":"references/multi-panel.md","l":216,"t":"**When to use:** Product transformation, makeover, time comparison, renovation — two states side by side.","o":"regla"},"90d4b17bba47":{"s":"image","a":"references/multi-panel.md","l":243,"t":"**Recommended size:** 1536x1024 (landscape — gives each half a portrait-like proportion)","o":"regla"},"910dd4553129":{"s":"image","a":"references/multi-panel.md","l":244,"t":"**Model:** GPT Image 2 `quality: medium` — for text labels (\"BEFORE\" / \"AFTER\"), use `quality: high`","o":"regla"},"d8c349628ad4":{"s":"image","a":"references/multi-panel.md","l":248,"t":"Left/right assignment matters — always state which side is before and which is after","o":"regla"},"1e4fc13d2d29":{"s":"image","a":"references/multi-panel.md","l":254,"t":"**When to use:** Full narrative in one image — 3x4 grid (3 columns, 4 rows) for animation or video pre-production.","o":"regla"},"a0be4760c51c":{"s":"image","a":"references/multi-panel.md","l":294,"t":"**Recommended size:** 1024x1536 (portrait — 3 columns x 4 rows needs vertical space)","o":"regla"},"1062c830e923":{"s":"image","a":"references/multi-panel.md","l":295,"t":"**Model:** GPT Image 2 `quality: high` (text-heavy — scene numbers and captions must be readable)","o":"regla"},"eb71e5086205":{"s":"image","a":"references/multi-panel.md","l":300,"t":"Art style must be stated once and applied uniformly; mixing styles across panels produces visual chaos","o":"regla"},"bf6161618f55":{"s":"image","a":"references/multi-panel.md","l":308,"t":"**Subject consistency:** Always include an explicit instruction: \"same person / same character / same product across all panels.\" Repeat key identity markers (hair color, clothing, distinguishing features) rather than saying \"same as before.\"","o":"regla"},"f6982091002c":{"s":"image","a":"references/multi-panel.md","l":310,"t":"**Grid specification:** Always state the grid dimensions (e.g., \"3x2 grid, 3 columns 2 rows\"). Saying \"6 panels\" without layout instruction lets the model choose an unpredictable arrangement.","o":"regla"},"dabc108ffb16":{"s":"image","a":"references/nano-banana.md","l":24,"t":"Числовые параметры объектива: **50mm, 85mm, f/2.8, ISO 400** — NB игнорит. Используй описание: «shallow depth of field», «wide-angle distortion».","o":"regla"},"0456a3106233":{"s":"image","a":"references/nano-banana.md","l":55,"t":"Включён по умолчанию; у NBP отключить нельзя (модель рисует до 2 «thought images» в бэкенде, они не тарифицируются как картинки, но thinking-токены платные). У NB2 есть рычаг `thinking_level: minimal | high` (default `minimal`) — поднимай до `high` для:","o":"regla"},"a509f495c750":{"s":"image","a":"references/nano-banana.md","l":102,"t":"Interactions API держит контекст сессии — до 3 последовательных правок стэкаются без потери исходника. Правило «Edit, don't re-roll»: картинка верна на 80% — проси точечное изменение, а не новую генерацию.","o":"regla"},"82d4b1aa2d36":{"s":"image","a":"references/nano-banana.md","l":130,"t":"**Хэндофф в видеомодель — motion brief, не пересказ.** Движение камеры, движение субъекта, движение фона, длительность, framing lock, запрещённые изменения. Видео-промпт не переописывает то, что уже есть в кадре.","o":"regla"},"3de5ceee5c4e":{"s":"image","a":"references/nano-banana.md","l":137,"t":"Инфографика может содержать фактически неверные данные — цифры проверять всегда, grounding помогает, но не гарантирует.","o":"regla"},"f7781b9ee5c2":{"s":"image","a":"references/patterns/character-design.md","l":9,"t":"Use for game or animation pre-production — front, side, and back views of a character on a single white canvas with color callouts and height reference lines.","o":"regla"},"31a9f9f11aa7":{"s":"image","a":"references/patterns/character-design.md","l":23,"t":"**Recommended model:** GPT I ns, conceptual art, or album visuals — a portrait where the subject floats in clear water surrounded by translucent aquatic elements.","o":"regla"},"be5a2e46231a":{"s":"image","a":"references/patterns/portrait-cinema.md","l":97,"t":"**Recommended model:** NBP — complex physics (floating hair, fabric, fish transparency, caustic light)","o":"regla"},"5c934f24e5bd":{"s":"image","a":"references/patterns/poster-illustration.md","l":9,"t":"Use for urban development campaigns, anniversary materials, cultural exhibitions, or editorial features — a single city view divided down the middle, one half historical and one half modern.","o":"regla"},"535d74d81a91":{"s":"image","a":"references/patterns/poster-illustration.md","l":28,"t":"**Recommended model:** NBP — spatial reasoning for architectural morphing and perspective consistency","o":"regla"},"44c898225d80":{"s":"image","a":"references/patterns/poster-illustration.md","l":40,"t":"Use for sport and fitness brand campaigns — a dynamic 3-panel collage combining action, detail, and atmosphere around a boxing/combat sport theme.","o":"regla"},"4c1d2cabad77":{"s":"image","a":"references/patterns/poster-illustration.md","l":59,"t":"**Recommended model:** GPT Image 2 — identity consistency across panels and sweat/texture detail","o":"regla"},"7b6acbb90a0a":{"s":"image","a":"references/patterns/poster-illustration.md","l":65,"t":"Use for tech product launch visuals — clean, color-dominant hero shots where a smartphone (or similar device) floats against a monochromatic gradient with soft 3D accent elements.","o":"regla"},"57fca5220269":{"s":"image","a":"references/patterns/poster-illustration.md","l":82,"t":"**Recommended model:** GPT Image 2 (`quality: high`) — text rendering, screen content legibility, device accuracy","o":"regla"},"c755ff2903b8":{"s":"image","a":"references/patterns/poster-illustration.md","l":88,"t":"Use for fashion drops, event announcements, or editorial magazine covers where bold typography and a street fashi d model:** GPT Image 2 (`quality: high`) — device bezel precision, small UI text, and headline legibility all demand high quality","o":"regla"},"b1a90c3a0a1d":{"s":"image","a":"references/patterns/ui-social.md","l":81,"t":"Use for realistic analytics dashboard mockups — dark or light theme with data visualizations, KPI cards, and sidebar navigation.","o":"regla"},"8f24d3e22d84":{"s":"image","a":"references/patterns/ui-social.md","l":104,"t":"**Recommended model:** GPT Image 2 (`quality: high`) — dense text (labels, numbers, navigation), precise chart rendering, and small UI elements require high fidelity","o":"regla"},"6b8e9a41cbf9":{"s":"image","a":"references/patterns/ui-social.md","l":116,"t":"Use to create a visual color analysis graphic from a portrait — seasonal palette classification, clothing color comparisons, and accessory recommendations in an organized layout.","o":"regla"},"5bb61a5742b2":{"s":"image","a":"references/patterns/ui-social.md","l":133,"t":"**Key levers:** `{subject_description}` (age, skin tone, hair color, eye color — needed for accurate seasonal analysis), `{season_type}` (Warm Spring, Cool Summer, Warm Autumn, Cool Winter — or sub-seasons like Soft Autumn, Bright Winter), `{palette_colors}` (12 hex values matching the season, e.g. Warm Autumn: rust #B7410E, olive #708238, mustard #E1AD01, burgundy #722F37...), `{num_palette}` (12","o":"regla"},"e3ff88ae7b6f":{"s":"image","a":"references/patterns/ui-social.md","l":135,"t":"**Recommended model:** GPT Image 2 (`quality: high`) — color accuracy of palette swatches is critical, plus small text labels throughout","o":"regla"},"c8d4fff1dabe":{"s":"image","a":"references/prompt-framework.md","l":39,"t":"**Палитра** - цвета (лучше hex)","o":"regla"},"58817d380494":{"s":"image","a":"references/prompt-framework.md","l":43,"t":"> - **Nano Banana** — игнорит числа, пиши описательно («shallow depth of field»)","o":"regla"},"85e2a5dc4aa8":{"s":"image","a":"references/prompt-framework.md","l":88,"t":"> Формулируй позитивно! NBP лучше понимает \"clean background\" чем \"no clutter\"","o":"regla"},"5856058c8a75":{"s":"image","a":"references/prompt-framework.md","l":159,"t":"Переменные записываются как `{name, default=\"value\"}`. Если значение не указано — используется дефолт. Если дефолта нет — переменная обязательна.","o":"regla"},"84828d3c69a2":{"s":"image","a":"references/prompt-framework.md","l":173,"t":"**Заменяй только то, что меняется** — остальное берётся из дефолтов","o":"regla"},"a90636943228":{"s":"image","a":"references/prompt-framework.md","l":174,"t":"**Структура стабильна** — порядок слотов одинаковый для всех вариаций, модель получает консистентный формат","o":"regla"},"8005da81a345":{"s":"image","a":"references/prompt-framework.md","l":175,"t":"**Batch-генерация** — идеально для серий: продуктовые ракурсы, позы персонажа, локации в одном стиле","o":"regla"},"42a42a73fa09":{"s":"image","a":"references/prompt-framework.md","l":212,"t":"**Surface wear & aging** — \"chipped paint on window frame, hairline scratches on metal surface, green patina on copper fittings, oxidation marks on iron hinges\"","o":"regla"},"4bc498edcc17":{"s":"image","a":"references/prompt-framework.md","l":213,"t":"**Micro-textures** — \"visible pores on skin, individual hair strands catching backlight, fabric weave pattern on linen shirt, grain of weathered wood\"","o":"regla"},"bc6d5c9aff5f":{"s":"image","a":"references/prompt-framework.md","l":214,"t":"**Atmospheric particles** — \"dust motes suspended in light beam, steam wisps rising from coffee cup, pollen floating in golden hour air, fine rain droplets on glass surface\"","o":"regla"},"318b118d917d":{"s":"image","a":"references/prompt-framework.md","l":215,"t":"**Specular behavior** — \"specular highlights on metal edges of watch, caustic reflections dancing inside glass bottle, wet surface sheen on cobblestones after rain\"","o":"regla"},"92eeb4747a7e":{"s":"image","a":"references/prompt-framework.md","l":216,"t":"**Fabric & material drape** — \"natural fabric folds at elbow crease, gravity pull on loose linen garment, weight distribution visible in heavy wool coat\"","o":"regla"},"51b0bfedb210":{"s":"image","a":"references/prompt-framework.md","l":217,"t":"**Contact shadows** — \"soft contact shadow where cup meets saucer, ambient occlusion in crevices of stone wall, dark line where book spine meets table\"","o":"regla"},"329aa0a4fa84":{"s":"image","a":"references/prompt-framework.md","l":218,"t":"**Environmental reflections** — \"building reflections in wet pavement, sky gradient in chrome bumper surface, warm neon glow on skin from nearby sign\"","o":"regla"},"11ec80431f42":{"s":"image","a":"references/prompt-framework.md","l":219,"t":"**Motion cues** — \"slight motion blur on trailing hair strand, frozen splash droplet from espresso pour, wind-displaced fabric edge of scarf\"","o":"regla"},"796d88912233":{"s":"image","a":"references/slides.md","l":29,"t":"Избегай pure white #fff на чёрном - используй #f5f5f5","o":"regla"},"2f0619f0ec28":{"s":"image","a":"references/slides.md","l":32,"t":"Контент должен дышать","o":"regla"},"c9068adfe734":{"s":"image","a":"references/storyboards.md","l":78,"t":"\"Identity must stay consistent throughout\"","o":"regla"},"3244bb3011e7":{"s":"image","a":"references/storyboards.md","l":81,"t":"\"Expressions and poses should vary\"","o":"regla"},"8e32b234137b":{"s":"image","a":"references/text-rendering.md","l":126,"t":"Ask the model to write/refine the text content","o":"regla"},"7447d548b9f0":{"s":"image","a":"references/text-rendering.md","l":127,"t":"Then ask for an image with that exact text","o":"regla"},"0db1539c575d":{"s":"image","a":"references/text-rendering.md","l":167,"t":"Upload with prompt: \"Use layout from attached image\"","o":"regla"},"7e22722f52fa":{"s":"image","a":"references/vision-decomposer.md","l":3,"t":"Use this reference when the user asks to analyze an image and convert it to a generation prompt: **style transfer**, **mood reference**, **\"сделай промпт по этой картинке\"**, **\"перенеси стиль/образ\"**, **\"проанализируй кадр\"**, **\"image to prompt\"**, **\"reverse-engineer this look\"**.","o":"regla"},"442a75c51f58":{"s":"image","a":"references/vision-decomposer.md","l":7,"t":"The process has two strict steps. Do not skip Step 1. Do not freestyle Step 2.","o":"regla"},"a712726b25c7":{"s":"image","a":"references/vision-decomposer.md","l":36,"t":"**Figure & ground (Arnheim):** degree of subject isolation, overlapping of forms, mass relationships. Use of reflections (mirrors, windows) to expand context.","o":"regla"},"04cb7f3e5408":{"s":"image","a":"references/vision-decomposer.md","l":44,"t":"**Broken light & reflexes (Zheleznyakov):** use of shadow masks (gobos), light through blinds / foliage, color reflexes from neighboring objects onto skin / clothing.","o":"regla"},"7d2338d1b298":{"s":"image","a":"references/vision-decomposer.md","l":49,"t":"**Camera (angles & viewpoint):** Angle (High angle, Low angle, Eye-level, Dutch tilt). Objective camera, Subjective, POV, Over-the-shoulder (OTS). Movement imitation (Push-in, Tracking shot).","o":"regla"},"3d2a2115477d":{"s":"image","a":"references/vision-decomposer.md","l":62,"t":"Describe **strictly what you see**. Do not invent new objects.","o":"regla"},"7cf887e9d7c2":{"s":"image","a":"references/vision-decomposer.md","l":63,"t":"**No filler.** Never write \"The image shows...\", \"A picture of...\", \"I can see...\".","o":"regla"},"526a0bad384e":{"s":"image","a":"references/vision-decomposer.md","l":109,"t":"Do NOT load this for: pure generation requests where no reference image is given. For those, use the standard model files.","o":"regla"},"a4a34906e54d":{"s":"produccion-visual-sw30","a":"SKILL.md","l":20,"t":"Si la respuesta es NO: no se entrega. Se leen los archivos faltantes, se aplica lo que falte y se vuelve a preguntar. Se repite cuantas veces sea necesario.","o":"regla"},"ab216a6c933f":{"s":"produccion-visual-sw30","a":"SKILL.md","l":22,"t":"Prohibido responder SÍ para complacer. Un SÍ falso es una mentira y cuesta más que el NO.","o":"regla"},"5c17fa63163e":{"s":"produccion-visual-sw30","a":"SKILL.md","l":23,"t":"Prohibido responder SÍ con matices, condiciones o notas al pie disfrazadas de honestidad.","o":"regla"},"241ea833ab9d":{"s":"produccion-visual-sw30","a":"SKILL.md","l":24,"t":"\"Exhaustiva\" significa: leídos COMPLETOS todos los archivos del skill aplicables al caso (SKILL.md indica el orden obligatorio), no fragmentos ni grep.","o":"regla"},"26da6aecb6fb":{"s":"produccion-visual-sw30","a":"SKILL.md","l":33,"t":"Orden de dirección: nunca se escribe un prompt de corrido ni se parchea texto. Tres pasos, en este orden:","o":"regla"},"87eadbf796d1":{"s":"produccion-visual-sw30","a":"SKILL.md","l":35,"t":"**CATALOGAR** — identificar el TIPO de prompt y leer qué reglas aplican a ese tipo en la matriz (production-package/RULES_MATRIX.md: 26 reglas × 5 tipos, con fuente y bloque de cada una). Tipos: T1 maestro rostro · T2 maestro cuerpo · T3 cuadro 1 persona · T4 cuadro 2 personas · T5 edición quirúrgica.","o":"regla"},"d48021c639e6":{"s":"produccion-visual-sw30","a":"SKILL.md","l":39,"t":"**DEFINIR SECCIONES** — antes de redactar, listar las secciones que ese tipo exige. Cada regla vive en UN bloque nombrado y compartido (optics_*, skin_*, anatomy, idlock, text_lock, contact_*, unique, colour, hair, fabric, clean_*, autocontain_*), nunca en texto suelto dentro del brief.","o":"regla"},"4a2eeac6c89d":{"s":"produccion-visual-sw30","a":"SKILL.md","l":42,"t":"**ENSAMBLAR POR SECCIÓN** — el prompt se construye llamando P(scene, subject, [details], mood, usecase, [constraints]) para creación o E(change, preserve, [constraints]) para edición, pasando bloques. Salida en el formato de SKILL.md del skill image: cabecera Model/Quality/Size + References","o":"regla"},"6658223ecd3e":{"s":"produccion-visual-sw30","a":"SKILL.md","l":52,"t":"`rule_registry.py` — relee los 23 archivos del skill image y EXTRAE mecánicamente cada enunciado normativo (209). Si el skill cambia, el registro cambia solo. Mi interpretación deja de ser etapa.","o":"regla"},"3348210ad98e":{"s":"produccion-visual-sw30","a":"SKILL.md","l":54,"t":"`rule_ledger.py` — obliga a que CADA regla aplicable tenga disposición explícita: CHECK (existe verificación) o NA (con razón escrita y auditable). Sale con código 1 si queda una sola PENDING.","o":"regla"},"b37aa531231e":{"s":"produccion-visual-sw30","a":"SKILL.md","l":56,"t":"`audit_gi2.py` — verifica los prompts columna por columna.","o":"regla"},"5a5348b20c81":{"s":"produccion-visual-sw30","a":"SKILL.md","l":73,"t":"usecase | `usecase_doc` | fotografía documental Kodak Tri-X de reportaje. Kodak Portra suaviza la piel por diseño y contradice los poros — PROHIBIDO en rostros","o":"regla"},"7ba769efe2d7":{"s":"produccion-visual-sw30","a":"SKILL.md","l":83,"t":"`production-package/template_engine.py` es OBLIGATORIO para construir cualquier prompt visual.","o":"regla"},"c0bc3ce2b122":{"s":"produccion-visual-sw30","a":"SKILL.md","l":84,"t":"Un prompt no se escribe: se INSTANCIA con `build(tipo, ..., notes=...)`. El motor lanza","o":"regla"},"ca17e7d8bf24":{"s":"produccion-visual-sw30","a":"SKILL.md","l":97,"t":"**PROHIBIDO editar el texto de un brief individual.** Eso es parchar: arregla una cosa y rompe otra, y es la causa raíz de los ciclos de tres reescrituras.","o":"regla"},"5cf46d07bcac":{"s":"produccion-visual-sw30","a":"SKILL.md","l":116,"t":"Un solo trabajo por generación. Con dos personajes: un sujeto por generación, o técnica de colocación probada; nunca \"a ver si sale\".","o":"regla"},"613774db48c2":{"s":"produccion-visual-sw30","a":"SKILL.md","l":118,"t":"Posición SIEMPRE por ancla legible de la propia imagen (letterforms del mundo: \"his back level with the letter L of WORLD\"). Prohibido \"left half\", \"centre\", \"just left of X\".","o":"regla"},"762ce60bec5e":{"s":"produccion-visual-sw30","a":"SKILL.md","l":120,"t":"El editor no tiene memoria: solo verbos operativos (Move/Replace/Add/Remove/Swap), cero narrativa (\"has become\", \"again\").","o":"regla"},"cb50b580f819":{"s":"produccion-visual-sw30","a":"SKILL.md","l":122,"t":"Autocontención: toda comparación (\"same X\") exige ambos referentes adjuntos en ESE prompt.","o":"regla"},"ff510d7ca127":{"s":"produccion-visual-sw30","a":"SKILL.md","l":123,"t":"Herencia mínima: \"same face and clothes\" + solo los deltas. Cero re-descripción de lo que la referencia ya muestra.","o":"regla"},"4fcb4afa54c3":{"s":"produccion-visual-sw30","a":"SKILL.md","l":125,"t":"Swap de identidad = última operación, sola: \"Replace X with Y — same position, same pose, same scale\".","o":"regla"},"4d4ea0758b3f":{"s":"produccion-visual-sw30","a":"SKILL.md","l":127,"t":"Mundos por dos pasos: placa vacía primero; insert con \"use only the person from image N, ignore its setting\" + \"keep the world of image 1 untouched\".","o":"regla"},"b6df20344be1":{"s":"produccion-visual-sw30","a":"SKILL.md","l":129,"t":"Stills en instante congelado (\"frozen mid-stride\"); nada de movimiento en imagen fija.","o":"regla"},"7dc14c265b1a":{"s":"produccion-visual-sw30","a":"SKILL.md","l":130,"t":"Contactos entre personas: \"a natural high five\" — la anatomía la fija el keyframe aprobado, nunca la asignación de manos por texto.","o":"regla"},"204113433c22":{"s":"produccion-visual-sw30","a":"SKILL.md","l":132,"t":"Logos solo heredados de asset aprobado o descripción canónica del brand-lock; los cuerpos nunca tapan logo ni lettering en frames congelados.","o":"regla"},"0895bf9c3c72":{"s":"produccion-visual-sw30","a":"SKILL.md","l":134,"t":"Lo aprobado se canoniza con hash y se EDITA desde ahí; lo caro nunca se regenera.","o":"regla"},"3f9822c97a3a":{"s":"produccion-visual-sw30","a":"SKILL.md","l":135,"t":"\"Edit, don't re-roll\": resultado ≥80% correcto → cambio puntual (hasta 3 ediciones apiladas), nunca re-tirar.","o":"regla"},"f9fee85351f3":{"s":"produccion-visual-sw30","a":"SKILL.md","l":137,"t":"Máximo 2 intentos por método. A la 2ª falla: cambio de método con causa declarada, o alto y consulta. Nunca tercera vuelta de lo mismo.","o":"regla"},"0aad9d5a3dfa":{"s":"produccion-visual-sw30","a":"SKILL.md","l":139,"t":"Validadores del paquete y techos de palabras en verde antes de entregar; inspección visual propia (zooms 100% de rostros y manos) antes de presentar. Si algo falla: no se entrega, se repite — y se dice qué falló en una línea.","o":"regla"},"aeb5f5e9292c":{"s":"produccion-visual-sw30","a":"SKILL.md","l":142,"t":"shots.json es la fuente de verdad: todo cambio entra ahí primero y se propaga.","o":"regla"},"2dddf6f48ba3":{"s":"produccion-visual-sw30","a":"SKILL.md","l":143,"t":"Clips: solo Preserve-cues, roles de start/tail (\"The tail image defines X — inherit exactly\"), movimiento puro, imagen final nombrada; negativos sin \"no X\", ≤8 ítems.","o":"regla"},"44283e478fd4":{"s":"produccion-visual-sw30","a":"SKILL.md","l":145,"t":"Entregas en unidades chicas con OK de dirección; se entrega el delta, no el paquete. Una regla nueva de dirección se aplica a TODOS los prompts, no a la mitad.","o":"regla"},"84846df151fa":{"s":"produccion-visual-sw30","a":"SKILL.md","l":147,"t":"Respuestas: el dato o entregable en la primera línea. Cero adulación y cero evaluación de las acciones de Eric salvo que la pida. Error = una línea de corrección, sin disculpas.","o":"regla"},"6da8440e93ad":{"s":"produccion-visual-sw30","a":"SKILL.md","l":149,"t":"Prohibido afirmar capacidades, límites o hechos de plataforma sin verificarlos en este turno (leer la fuente o buscar); lo no verificado se etiqueta como inferencia.","o":"regla"},"fb3896038afa":{"s":"screenwriter","a":"SKILL.md","l":77,"t":"Always use ALL CAPS for sluglines","o":"archivo"},"4d9355018ad2":{"s":"screenwriter","a":"SKILL.md","l":78,"t":"Use hyphens to separate elements","o":"archivo"},"57e9c487ac74":{"s":"screenwriter","a":"SKILL.md","l":80,"t":"Time should suggest lighting/mood","o":"archivo"},"fa0199539554":{"s":"screenwriter","a":"SKILL.md","l":87,"t":"**Show, Don't Tell:** Write what's visible, not internal thoughts","o":"archivo"},"e10b5f7be709":{"s":"screenwriter","a":"SKILL.md","l":88,"t":"**Sensory Details:** Include lighting, atmosphere, textures, colors","o":"archivo"},"45f2e43f67e0":{"s":"screenwriter","a":"SKILL.md","l":89,"t":"**Present Tense:** Always write in present tense","o":"archivo"},"a93dbeef8737":{"s":"screenwriter","a":"SKILL.md","l":90,"t":"**Active Voice:** Use strong, active verbs","o":"archivo"},"10e5da2fcf9a":{"s":"screenwriter","a":"SKILL.md","l":91,"t":"**Specific Props:** Name objects that matter visually","o":"archivo"},"59d398f4c454":{"s":"screenwriter","a":"SKILL.md","l":92,"t":"**Atmosphere:** Set mood through environmental details","o":"archivo"},"671c49de0056":{"s":"screenwriter","a":"SKILL.md","l":128,"t":"Avoid excessive detail—just enough for visual consistency","o":"archivo"},"27e302d3a37e":{"s":"screenwriter","a":"SKILL.md","l":140,"t":"Use dialogue ONLY when essential to story","o":"archivo"},"5645bf344589":{"s":"screenwriter","a":"SKILL.md","l":157,"t":"`CUT TO:` - Scene change (usually implied, use for emphasis)","o":"archivo"},"68d5f2185557":{"s":"screenwriter","a":"SKILL.md","l":162,"t":"**Modern Best Practice:** Most transitions are IMPLIED. Use sparingly, only for specific narrative effect.","o":"archivo"},"c775d8acd13e":{"s":"screenwriter","a":"SKILL.md","l":235,"t":"**Emotional beats:** Each scene should shift emotional state","o":"archivo"},"8cc0ef448f33":{"s":"screenwriter","a":"SKILL.md","l":244,"t":"**Consistent naming:** Use same character names throughout","o":"archivo"},"bff5030b3380":{"s":"screenwriter","a":"SKILL.md","l":253,"t":"**Lean prose:** Each word should serve the image","o":"archivo"},"35abb8abc912":{"s":"screenwriter","a":"SKILL.md","l":256,"t":"❌ **Vague descriptions:** \"A person walks\" → ✅ \"A weathered woman in her 50s trudges through snow\"","o":"archivo"},"df9b899dbc91":{"s":"screenwriter","a":"SKILL.md","l":257,"t":"❌ **Telling emotions:** \"She feels sad\" → ✅ \"Tears streak her dusty cheeks\"","o":"archivo"},"de28e225dfa5":{"s":"screenwriter","a":"SKILL.md","l":258,"t":"❌ **Camera directions:** \"CLOSE UP ON\" → ✅ \"The crack in the glass spreads\"","o":"archivo"},"aa1edc03619b":{"s":"screenwriter","a":"SKILL.md","l":259,"t":"❌ **Over-dialogue:** Short films need visual storytelling","o":"archivo"},"0cf150e839a8":{"s":"screenwriter","a":"SKILL.md","l":260,"t":"❌ **Inconsistent character names:** Stick to ONE name per character","o":"archivo"},"b6cf18f1ea26":{"s":"screenwriter","a":"references/advanced-techniques.md","l":16,"t":"While avoiding technical camera directions in action lines, you can *suggest* camera movement through visual description and scene structure.","o":"archivo"},"f1221744d7a1":{"s":"screenwriter","a":"references/advanced-techniques.md","l":85,"t":"Each character should have distinct speech patterns:","o":"archivo"},"42187af933ee":{"s":"screenwriter","a":"references/advanced-techniques.md","l":127,"t":"Each scene should raise stakes or tension incrementally:","o":"archivo"},"38b4028efe2f":{"s":"screenwriter","a":"references/advanced-techniques.md","l":172,"t":"Use color to track emotional/narrative arc:","o":"archivo"},"5ea772208440":{"s":"screenwriter","a":"references/advanced-techniques.md","l":184,"t":"Every scene must serve multiple purposes:","o":"archivo"},"3697579b1689":{"s":"screenwriter","a":"references/advanced-techniques.md","l":202,"t":"First 10-15 seconds must grip audience:","o":"archivo"},"dcba7967bb86":{"s":"screenwriter","a":"references/pipeline-integration.md","l":20,"t":"Every scene MUST include all required metadata fields for reliable pipeline processing:","o":"archivo"},"34d356cca129":{"s":"screenwriter","a":"references/pipeline-integration.md","l":48,"t":"Use 1-3 adjectives that guide visual tone:","o":"archivo"},"06f7cfabe30d":{"s":"screenwriter","a":"references/pipeline-integration.md","l":51,"t":"Avoid: \"the character feels anxious\" (this describes internal state, not mood)","o":"archivo"},"f02d8dcae6c2":{"s":"screenwriter","a":"references/pipeline-integration.md","l":68,"t":"The `key_visuals` array should contain discrete, image-generation-friendly descriptions:","o":"archivo"},"9a04fd13f520":{"s":"screenwriter","a":"references/pipeline-integration.md","l":137,"t":"After first appearance, use consistent identifiers:","o":"archivo"},"d58376dbc7f5":{"s":"screenwriter","a":"references/pipeline-integration.md","l":140,"t":"Use character name only: \"Maya checks her phone\"","o":"archivo"},"33379bbc4b87":{"s":"screenwriter","a":"references/pipeline-integration.md","l":175,"t":"Option B: Use fractional numbering (1, 2, 2A, 3...)","o":"archivo"},"8a33756b8cb8":{"s":"screenwriter","a":"references/pipeline-integration.md","l":177,"t":"For pipeline simplicity, prefer Option A (complete renumbering).","o":"archivo"},"3172bdb34a71":{"s":"screenwriter","a":"references/pipeline-integration.md","l":222,"t":"Ensure valid XML structure:","o":"archivo"},"47f320764950":{"s":"screenwriter","a":"references/pipeline-integration.md","l":266,"t":"[ ] No technical camera directions (use visual descriptions instead)","o":"archivo"},"364c86aacbd6":{"s":"storyboard-architect","a":"SKILL.md","l":22,"t":"If the user only wants prompts for an image generator (no narrative structure), use `visual-prompt-forge` directly instead.","o":"archivo"},"7696a03e6c31":{"s":"storyboard-architect","a":"SKILL.md","l":40,"t":"Write it once, at the end of the run, and never edit it.","o":"archivo"},"8f9cad0e2224":{"s":"storyboard-architect","a":"SKILL.md","l":42,"t":"If the user asks for image prompts or HTML preview, hand off to `visual-prompt-forge` or `storyboard-html-preview`, those skills consume `shots.json` directly. Don't try to do their job here.","o":"archivo"},"8d21f65f4329":{"s":"storyboard-architect","a":"SKILL.md","l":54,"t":"Brand-lock file path | No | Use `brand-packs/_template.md` and flag the gap","o":"auditoria"},"0a6768420027":{"s":"storyboard-architect","a":"SKILL.md","l":60,"t":"Follow this sequence. Don't skip steps even if the brief seems simple.","o":"archivo"},"c7861b2bb543":{"s":"storyboard-architect","a":"SKILL.md","l":69,"t":"\"Never\" list (what this brand will never do visually)","o":"auditoria"},"8b27a216f395":{"s":"storyboard-architect","a":"SKILL.md","l":72,"t":"Aspect-ratio preferences","o":"auditoria"},"5b7b1c8fb6ae":{"s":"storyboard-architect","a":"SKILL.md","l":74,"t":"If no brand-lock is provided, copy `brand-packs/_template.md` into the output as `brand-lock.snapshot.md` with a note: `# UNCONFIGURED, using template defaults. Recommend providing a real brand-lock for production work.`","o":"auditoria"},"0b4182e7f0fc":{"s":"storyboard-architect","a":"SKILL.md","l":96,"t":"Don't fight the framework. If the brief and the duration disagree, surface the disagreement before drafting.","o":"archivo"},"37204f4e9d9d":{"s":"storyboard-architect","a":"SKILL.md","l":107,"t":"`start` / `end`, timestamps in seconds, decimal allowed. `end` must be after `start`","o":"archivo"},"bbcf9882e50b":{"s":"storyboard-architect","a":"SKILL.md","l":113,"t":"`depth_of_field`, optional, shallow / deep / rack","o":"auditoria"},"5942ba44f22f":{"s":"storyboard-architect","a":"SKILL.md","l":128,"t":"Every piece of on-screen text becomes an entry in `text-overlays.json`. Never bake text into the visual description. Each overlay has:","o":"auditoria"},"1cec4673e7f2":{"s":"storyboard-architect","a":"SKILL.md","l":137,"t":"`color`, hex (must come from brand-lock palette)","o":"auditoria"},"abc02ebdb6a8":{"s":"storyboard-architect","a":"SKILL.md","l":151,"t":"Every shot has a one-sentence rationale. Why this beat. Why this framing. Why this on-screen text. This is the audit trail. Do not skip it.","o":"archivo"},"38de07452a46":{"s":"storyboard-architect","a":"SKILL.md","l":192,"t":"Use the template at `templates/storyboard.md.tpl`. Read it before writing."," e URL, a brand book PDF, screenshots, or a written description and produces a `brand-lock.md` in this exact format, with a confidence and source noted for every value:","o":"archivo"},"c5e62839e1ee":{"s":"storyboard-architect","a":"brand-packs/_template.md","l":25,"t":"Add more rows if the brand has more named colors. Don't add more than 8, past that, the brand stops being recognizable.","o":"archivo"},"2f545717c91e":{"s":"storyboard-architect","a":"brand-packs/_template.md","l":49,"t":"What this brand never does, visually or tonally. Be specific.","o":"archivo"},"e03457ae7069":{"s":"storyboard-architect","a":"brand-packs/_template.md","l":51,"t":"never use stock photo aesthetic","o":"archivo"},"25f0ecf00da8":{"s":"storyboard-architect","a":"brand-packs/_template.md","l":52,"t":"never use AI uncanny faces","o":"archivo"},"1acd5803bd0f":{"s":"storyboard-architect","a":"brand-packs/_template.md","l":53,"t":"never over-saturate","o":"archivo"},"3214012dc24d":{"s":"storyboard-architect","a":"brand-packs/_template.md","l":54,"t":"never shout in copy","o":"archivo"},"250eda4c5849":{"s":"storyboard-architect","a":"brand-packs/_template.md","l":55,"t":"never use clip-art icons","o":"archivo"},"5ada3d9e3057":{"s":"storyboard-architect","a":"brand-packs/_template.md","l":64,"t":"How footage and generated images should be graded. One sentence.","o":"archivo"},"25d9cd499896":{"s":"storyboard-architect","a":"examples/30s-pain-proof-promise/brand-lock.snapshot.md","l":40,"t":"never use stock photo aesthetic","o":"archivo"},"e815875bfd9e":{"s":"storyboard-architect","a":"examples/30s-pain-proof-promise/brand-lock.snapshot.md","l":41,"t":"never use AI uncanny faces","o":"archivo"},"dd6e8d6008ac":{"s":"storyboard-architect","a":"examples/30s-pain-proof-promise/brand-lock.snapshot.md","l":42,"t":"never over-saturate the cream background","o":"archivo"},"333c20110ff3":{"s":"storyboard-architect","a":"examples/30s-pain-proof-promise/brand-lock.snapshot.md","l":43,"t":"never use coral a "archivo"},"eb006504840c":{"s":"storyboard-architect","a":"examples/shotkit-explainer/brand-lock.snapshot.md","l":53,"t":"never default to dark mode, light mode hybrid is the brand","o":"archivo"},"783ff683393c":{"s":"storyboard-architect","a":"examples/shotkit-explainer/brand-lock.snapshot.md","l":54,"t":"never animate text with bouncing or wobbling, type-on, fade, or hard cut only","o":"archivo"},"8cea74bc14b1":{"s":"storyboard-architect","a":"examples/shotkit-explainer/brand-lock.snapshot.md","l":55,"t":"never break the eye line between subject and the implied \"operator perspective\"","o":"archivo"},"f6abdd226436":{"s":"storyboard-architect","a":"examples/shotkit-explainer/brand-lock.snapshot.md","l":66,"t":"Warm filmic, muted teal shadows. Slight grain. Cream highlights, deep navy/charcoal shadows, never crushed. Reminiscent of Kodak Portra 400 with a slight digital cleanup. Skin tones warm but not orange. Greens kept slightly desaturated to push focus to subject.","o":"archivo"},"d8a47abf50ca":{"s":"storyboard-architect","a":"examples/shotkit-explainer/brand-lock.snapshot.md","l":70,"t":"Camera moves are minimal and deliberate. Default to static. When motion is used, slow push or slow pull only. Cuts on action, not on time. Type-on for emphasis, never bouncing or wobbling. Coral periods animate as a hard pop on signature beats. Transitions are hard cuts or 6-frame dissolves only, no fancy wipes, no zooms.","o":"archivo"},"e9560a0de1ac":{"s":"storyboard-architect","a":"examples/shotkit-explainer/brand-lock.snapshot.md","l":82,"t":"prefer specific numbers over vague claims (\"48 hours\" not \"fast\", \"30 minutes a week\" not \"a little time\")","o":"archivo"},"cc0c55fe6755":{"s":"storyboard-architect","a":"examples/shotkit-explainer/brand-lock.snapshot.md","l":83,"t":"prefer present-tense over future-tense","o":"archivo"},"c1a8c5479b88":{"s":"storyboard-architect","a":"examples/shotkit-explainer/brand-lock.snapshot.md","l":84,"t":"prefer \"operator\" over \"creator\", \"infrastructure\" over \"agency\", \"system\" over \"service\"","o":"archivo"},"7e5f2e473cd3":{"s":"storyboard-architect","a":"references/beat-frameworks.md","l":3,"t":"Pick one. Don't invent a new one unless the brief genuinely doesn't fit. Document the choice in `storyboard.md`.","o":"archivo"},"f32c786bfbff":{"s":"storyboard-architect","a":"references/beat-frameworks.md","l":9,"t":"**Pain**, name the audience's actual problem in their actual language. Concrete, not abstract. \"Your content feels random\" not \"marketing inefficiency.\"","o":"archivo"},"d329c7d38124":{"s":"storyboard-architect","a":"references/beat-frameworks.md","l":10,"t":"**Reframe**, flip the problem on its head. The point is *not* what they thought it was. \"You don't have a content problem. You have an infrastructure problem.\"","o":"archivo"},"b55cf418fc3a":{"s":"storyboard-architect","a":"references/beat-frameworks.md","l":11,"t":"**Promise**, what life looks like on the other side. Specific, verifiable, time-bound when possible.","o":"archivo"},"e5235864c6bb":{"s":"storyboard-architect","a":"references/beat-frameworks.md","l":16,"t":"Use when: ad creative, landing-page hero video, conversion-focused social.","o":"archivo"},"0206d6df0cc3":{"s":"storyboard-architect","a":"references/beat-frameworks.md","l":22,"t":"**World**, set the context. Who lives in this world. What's broken about it.","o":"archivo"},"9b3fba335e1b":{"s":"storyboard-architect","a":"references/beat-frameworks.md","l":23,"t":"**Hero**, the product/founder/methodology arrives. Show what it does, not what it is.","o":"archivo"},"e4b20db35b44":{"s":"storyboard-architect","a":"references/beat-frameworks.md","l":24,"t":"**Transformation**, the world changes. Show before/after at scale.","o":"archivo"},"cfaecb7f5fa7":{"s":"storyboard-architect","a":"references/beat-frameworks.md","l":29,"t":"Use when: product launches, brand films, anchor pieces.","o":"archivo"},"39b17554140c":{"s":"storyboard-architect","a":"references/beat-frameworks.md","l":35,"t":"**Hook**, a one-line provocation (0–2s)","o":"archivo"},"ec4f8b7428c7":{"s":"storyboard-architect","a":"references/beat-frameworks.md","l":36,"t":"**Stakes**, why this matters (2–8s)","o":"archivo"},"3bdf77c5a1e7":{"s":"storyboard-architect","a":"references/beat-frameworks.md","l":37,"t":"**Insight**, the actual point (8–20s for 30s, 8–40s for 60s)","o":"archivo"},"6154ed831bf3":{"s":"storyboard-architect","a":"references/beat-frameworks.md","l":38,"t":"**Proof**, one concrete example or data point","o":"archivo"},"6be1e3549be6":{"s":"storyboard-architect","a":"references/beat-frameworks.md","l":39,"t":"**CTA**, what to do next, narrow and specific","o":"archivo"},"ca19a04f7f16":{"s":"storyboard-architect","a":"references/beat-frameworks.md","l":41,"t":"Use when: founder content, thought leadership, personal-brand pieces.","o":"archivo"},"e707043ad741":{"s":"storyboard-architect","a":"references/beat-frameworks.md","l":47,"t":"**Wide claim**, the headline take","o":"archivo"},"61117f1e1435":{"s":"storyboard-architect","a":"references/beat-frameworks.md","l":48,"t":"**Zoom 1**, one layer of nuance","o":"archivo"},"bcd48bb1ab67":{"s":"storyboard-architect","a":"references/beat-frameworks.md","l":49,"t":"**Zoom 2**, the layer underneath that","o":"archivo"},"409a346f14c6":{"s":"storyboard-architect","a":"references/beat-frameworks.md","l":50,"t":"**Snap-back**, return to the wide claim, now reframed by the zooms","o":"archivo"},"e4456cb5dc55":{"s":"storyboard-architect","a":"references/beat-frameworks.md","l":54,"t":"Use when: opinion videos, kinetic-type pieces, social-native commentary.","o":"archivo"},"86733dae8e0e":{"s":"storyboard-architect","a":"references/beat-frameworks.md","l":60,"t":"**Problem state**, what someone is stuck on","o":"archivo"},"4b795000d239":{"s":"storyboard-architect","a":"references/beat-frameworks.md","l":61,"t":"**Reveal**, the technique or trick","o":"archivo"},"a68a06f84fe6":{"s":"storyboard-architect","a":"references/beat-frameworks.md","l":62,"t":"**Walk-through**, apply it step by step","o":"archivo"},"0357fe063806":{"s":"storyboard-architect","a":"references/beat-frameworks.md","l":63,"t":"**Result**, the after-state, side-by-side with before","o":"archivo"},"08af446ba369":{"s":"storyboard-architect","a":"references/beat-frameworks.md","l":65,"t":"Use when: tutorials, demo videos, training content.","o":"archivo"},"428f5eebff7b":{"s":"storyboard-architect","a":"references/on-screen-text.md","l":3,"t":"Text on screen is a load-bearing decision. Most storyboards over-text. The default should be: **does this shot need text to land?** If the visual carries the meaning, text dilutes.","o":"archivo"},"a268ba75d0b5":{"s":"storyboard-architect","a":"references/on-screen-text.md","l":7,"t":"**Auto-play-mute environments.** Social feeds. Text replaces VO.","o":"archivo"},"efdeec778e0f":{"s":"storyboard-architect","a":"references/on-screen-text.md","l":8,"t":"**Concept compression.** A short phrase lands harder than 4 seconds of narration.","o":"archivo"},"90221fe5fe0f":{"s":"storyboard-architect","a":"references/on-screen-text.md","l":9,"t":"**Stat or proof point.** Numbers stick visually in a way they don't audibly.","o":"archivo"},"48c59084ee78":{"s":"storyboard-architect","a":"references/on-screen-text.md","l":10,"t":"**Beat punctuation.** A single word or phrase that lands on a music hit.","o":"archivo"},"9f529931cccc":{"s":"storyboard-architect","a":"references/on-screen-text.md","l":11,"t":"**CTA.** The action you want the viewer to take.","o":"archivo"},"c1fb4192e05a":{"s":"storyboard-architect","a":"references/on-screen-text.md","l":15,"t":"**Restating the VO.** If the voice says it, the text is noise.","o":"archivo"},"84655e935767":{"s":"storyboard-architect","a":"references/on-screen-text.md","l":16,"t":"**Decorative copy.** \"Moments matter\" floating over b-roll. Cut it.","o":"archivo"},"84f1791a022e":{"s":"storyboard-architect","a":"references/on-screen-text
