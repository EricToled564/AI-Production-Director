<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taller de prompts</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="barra">
  <div class="marca">Taller de prompts <span class="sub">GPT Image 2 · brief → reglas → prompt</span></div>
  <div class="proveedor">
    <label>Proveedor
      <select id="proveedor">
        <option value="anthropic">Anthropic API</option>
        <option value="manual">Manual (copiar y pegar)</option>
        <option value="openai">OpenAI API</option>
      </select>
    </label>
    <span id="aviso-proveedor" class="aviso-mini"></span>
  </div>
</header>
<div class="marco">
  <aside class="lateral">
    <button id="nuevo" class="primario ancho">Nuevo caso</button>
    <div id="lista-casos"></div>
    <div id="recursos-estado" class="aviso-mini"></div>
    <div id="respaldo" class="respaldo" hidden>
      <p class="nota">Los casos se guardan en este navegador. Exporta un respaldo con regularidad.</p>
      <button id="exp-respaldo" class="ancho">Exportar respaldo</button>
      <label class="boton ancho">Importar respaldo<input type="file" id="imp-respaldo" accept="application/json" hidden></label>
    </div>
  </aside>
  <main id="principal"><p class="vacio">Crea un caso o elige uno de la lista.</p></main>
</div>
<script src="/static/app.js"></script>
</body>
</html>
