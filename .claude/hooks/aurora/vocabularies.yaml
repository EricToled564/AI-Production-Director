  - broadcast realism

# ---------- NEGATIVE_BLOCK_POLICY (P2) ----------
# required        → falta de bloque = FAIL (campo negativo dedicado).
# optional        → no se exige (positive framing). Si aparece con marcador "Negative:" en NB/GPT/Veo/Flux → WARN.
# legacy_required → plataforma no resuelta: comportamiento v1.1 (required) + WARN.
NEGATIVE_BLOCK_POLICY:
  kling: required            # kling.md §6 "Kling has a dedicated negative prompts field"
  seedance_2.5: required     # seedance-25.md §7 Prohibitions + §19-A "[Negative Prompts]"
  seedance: optional         # seedance.md §12 "1.0 does NOT support negative prompts... 2.0 fragile"
  gpt-image: optional        # gpt-image.md 5 slots: "Constraints:" cuenta como bloque; lo exige la sección constraints_slot
  nano-banana: optional      # golden-rules §2 positive framing; models.md "Negative framing: использовать позитив"
  veo: optional              # veo.md §7 "Describe only motion, camera, light change, and audio"; fixes §4 "Veo body text"
  midjourney: optional       # U1 "only if the model supports them" — no se exige
  flux: optional             # _capabilities.json supports_negative_prompt false
  ideogram: optional
  seedream: optional
  hailuo: optional           # _capabilities.json supports_negative_prompt false
NEGATIVE_MAX_ITEMS: 8        # SW30 R16 "≤8 ítems"; kling.md §6 "Keep the list short"

# ---------- WORD_BUDGET_BY_PLATFORM (P1) — referencia, nunca bloquea ----------
# default: rango recomendado por el adaptador de forge / archivo de modelo.
# i2v: rango para casos 3a/3b/3c cuando el archivo de modelo da uno propio.
# ceiling: max_prompt_words de _capabilities.json ("a ceiling, not a target").
WORD_BUDGET_BY_PLATFORM:
  midjourney:
    default: [40, 80]
    ceiling: 100
    source: "forge adapters/midjourney.md 'Aim for 40–80 words'; _capabilities.json max_prompt_words 100"
  flux:
    default: [80, 150]
    ceiling: 150
    source: "forge adapters/flux.md '80–150 words'; _capabilities.json 150"
  ideogram:
    default: [60, 120]
    ceiling: 120
    source: "forge adapters/ideogram.md '60–120 words'; _capabilities.json 120"
  gpt-image:
    default: [150, 300]
    ceiling: 300
    source: "forge adapters/gpt-image.md '150–300 words'; _capabilities.json 300; SW30 template T1 ~250 palabras"
  nano-banana:
    default: [60, 120]
    ceiling: 120
    source: "forge adapters/nano-banana.md '60–120 words'; _capabilities.json 120 (SW30 T1 ~250 se reporta, no bloquea)"
  seedream:
    default: [40, 70]
    ceiling: 120
    source: "forge adapters/seedream.md '40–70 words'; _capabilities.json 120"
  kling:
    default: [80, 150]
    i2v: [20, 40]
    ceiling: 150
    source: "forge adapters/kling.md '80–150 words'; kling.md §5/§10 'Image-to-video (any version). 20-40 words'; _capabilities.json 150"
  veo:
    default: [80, 150]
    i2v: [50, 100]
    ceiling: 150
    source: "forge adapters/veo.md '80–150 words'; veo.md §3 sweet spot 50-200, §9 'Compress to the 50-100 word range'; _capabilities.json 150"
  seedance:
    default: [80, 150]
    ceiling: 150
    source: "forge adapters/seedance.md '80–150 words'; _capabilities.json 150; seedance.md §13 no fija número para I2V"
  seedance_2.5:
    default: [80, 150]
    ceiling: 150
    source: "forge adapters/seedance.md 80–150 / _capabilities.json 150 como única cifra disponible; seedance-25.md no fija número y sus ejemplos oficiales (§19) la superan — referencia informativa"
  hailuo:
    default: [60, 120]
    ceiling: 120
    source: "forge adapters/hailuo.md '60–120 words'; _capabilities.json 120"

