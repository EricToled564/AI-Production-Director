# Aurora Prompt Linter — Vocabulary Lists v1.2-fupai (2026-09-25)
# Copia ampliada de scripts/vocabularies.yaml v1.0/v1.1 del skill aurora-prompt-linter.
# Cada lista P/O/L/PR/S corresponde a una categoría de la IDs system v6.0 §7.
# Cuando un ref carga esa categoría, los términos listados quedan BANNED en el MAIN
# (no en el bloque negativo). P/O solo se banean con rol ff/lf (ver prompt_linter.py P3).
#
# Cambios respecto al original, con fuente:
#   - P: fuera sweat / sweaty / jawline (micro-acción corporal, dramaturgy §2, U3) → BODY_MICRO_ACTION_EXEMPT.
#   - S: fuera "cinematic" (director §6.1 / dramaturgy §2) → BANNED.
#   - BANNED: fuera slow motion / cartoon / anime / 3D render (condicionados: SLOW_MOTION_TERMS,
#     STYLE_BANNED_FOTORREAL); dentro la lista de dramaturgy §2 y la anti-slop de gpt-image.md.
#   - L / PR / O ampliadas: agua, automotriz, café/interior, clima, música/ensamble.
#   - Nuevas tablas: WORD_BUDGET_BY_PLATFORM, NEGATIVE_BLOCK_POLICY, IDENTITY_BLOCK_GROUPS,
#     TREATMENT_SECTION_OVERRIDES, snapshots seedance_2.5 / flux / ideogram / hailuo / seedream /
#     nano_banana_2 / kling_3.0__4.

