# ---------- SLOW MOTION (P7) ----------
# WARN en fotorreal (kling.md §11 lo recomienda como técnica anti-morphing; dramaturgy §7 pide razón),
# FAIL con --treatment race (race-and-speed.md §1 ley 1), exento con prefijo "ultra-" (kling.md §3 tempo).
SLOW_MOTION_TERMS:
  - slow motion
  - slow-motion
  - slowmo
  - slow-mo
  - slow mo
SLOW_MOTION_ALLOWED_PREFIXES:
  - "ultra-"
  - "ultra "

