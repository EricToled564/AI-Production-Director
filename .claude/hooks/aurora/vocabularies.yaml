# image/references/patterns/character-design.md ("Anime-Style Character Card"),
# multi-panel.md ("Pixar-style 3D", "anime cel shading"), editing.md ("vibrant anime").
STYLE_BANNED_FOTORREAL:
  - anime
  - anime-style
  - cartoon
  - cartoonish
  - 3D render
  - 3D rendered
  - 3D-rendered
  - CGI look
